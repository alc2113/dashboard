<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PJ's Pet Shop, Ad Performance</title>
<meta name="robots" content="noindex">
<!-- Thin wrapper (2026-09-22): this dashboard now runs on the shared template,
     ads.html?client=demo (registry entry in ads-clients.js). This file keeps the
     existing link and password working. Query params such as ?embed=1 pass through.
     The previous standalone page is in git history before this commit. -->
<script>
(function(){
  var q = new URLSearchParams(location.search);
  q.set("client", "demo");
  location.replace("ads.html?" + q.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=ads.html?client=demo"></noscript>
</head>
<body></body>
</html>
