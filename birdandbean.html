<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bird & Bean, Ad Performance</title>
<meta name="robots" content="noindex">
<!-- Thin wrapper (2026-09-22): the Bird & Bean dashboard now runs on the shared template,
     ads.html?client=birdandbean (registry entry in ads-clients.js). This file keeps the
     client's link and password working. Query params such as ?embed=1 pass through. -->
<script>
(function(){
  var q = new URLSearchParams(location.search);
  q.set("client", "birdandbean");
  location.replace("ads.html?" + q.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=ads.html?client=birdandbean"></noscript>
</head>
<body></body>
</html>
