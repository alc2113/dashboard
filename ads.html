        {label:"SL Earnings",data:combined.map(c=>c.earn),backgroundColor:COLORS[0],borderRadius:2,yAxisID:"y",order:2},
        {label:"CPA",type:"line",data:combined.map(c=>c.cpa),borderColor:COLORS[3],backgroundColor:COLORS[3],yAxisID:"y1",tension:.25,order:1},
        {label:"Net CPA",type:"line",data:combined.map(c=>c.netCpa),borderColor:COLORS[7],backgroundColor:COLORS[7],yAxisID:"y1",tension:.25,order:1}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{position:"top"}},
      scales:{y:{position:"left",beginAtZero:true,ticks:{callback:v=>"$"+v.toLocaleString()}},
              y1:{position:"right",grid:{drawOnChartArea:false},ticks:{callback:v=>"$"+(+v).toFixed(2)}}}}});
}

/* ── CRM truth layer: cost per CRM conversion by source, monthly ──
   CRM-created conversions (counted once by Create date + Original source)
   joined to platform spend. Platform-claimed shown for reference, never
   summed across platforms. Monthly grain; ignores the global date filter. */
let modCorrOn=false;
function renderModeled(){
  const NOUN=(MODELED&&MODELED.noun)||"Booking", CRM=(MODELED&&MODELED.crmName)||"CRM";
  const CORR=(MODELED&&MODELED.corrFactor)||0;
  const isPaid=s=>s.indexOf("Paid ")===0;
  const isAds=s=>isPaid(s)||s==="Google - Other";   // ads-scoped view: unpaid sources stay in the sheet, off the tab
  const adjB=(src,b)=>(modCorrOn&&CORR&&isPaid(src))?b*CORR:b;
  const months=[...new Set(MOD.rows.map(r=>r.month))].sort();
  // Real current month (not DMAX: the ad-ID product sheet can lag the modeled tabs)
  const now=new Date();
  const curMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const cellMap={}; MOD.rows.forEach(r=>cellMap[r.month+"|"+r.source]=r);
  const cpb=(m,s)=>{ const r=cellMap[m+"|"+s]; if(!r||!r.spend) return null; const b=adjB(s,r.bookings); return b>0?r.spend/b:null; };
  const paidSources=[...new Set(MOD.rows.filter(r=>isPaid(r.source)).map(r=>r.source))].sort();
  const fullMonths=months.filter(m=>m<curMonth), lm=fullMonths[fullMonths.length-1], pm=fullMonths[fullMonths.length-2];
  let kpis="";
  if(lm){
    paidSources.forEach(s=>{ const v=cpb(lm,s); if(v===null) return;
      const p=pm?cpb(pm,s):null;
      const d=(p!=null)?periodDelta(v,p,true,money):"";
      kpis+=`<div class="kpi"><div class="label">${s} Cost/${NOUN} (${lm})</div><div class="val">${money(v)}</div>${d}</div>`; });
    let pb=0,ps=0; paidSources.forEach(s=>{ const r=cellMap[lm+"|"+s]; if(r){pb+=adjB(s,r.bookings); ps+=r.spend;} });
    if(pb>0) kpis+=`<div class="kpi"><div class="label">All Paid Cost/${NOUN} (${lm})</div><div class="val">${money(ps/pb)}</div></div>`;
  }
  const corrCtl=CORR?`<div style="margin:0 0 10px;font-size:13px;"><label style="cursor:pointer;"><input type="checkbox" id="modCorr"${modCorrOn?" checked":""}> Apply source-loss correction (&times;${CORR} on paid ${NOUN.toLowerCase()}s)</label><div class="note">${MODELED.corrNote||""}</div></div>`:"";
  const tblBody=MOD.rows.filter(r=>isAds(r.source)).sort((a,b)=>a.month===b.month?(a.source<b.source?-1:1):(a.month<b.month?1:-1)).map(r=>{
    const b=adjB(r.source,r.bookings), c=(r.spend>0&&b>0)?money(r.spend/b):"—";
    return `<tr><td>${r.month}${r.month===curMonth?" (MTD)":""}</td><td>${r.source}</td><td class="num">${(modCorrOn&&b!==r.bookings)?b.toFixed(1):num(r.bookings)}</td><td class="num">${num(r.cancels)||"—"}</td><td class="num">${r.spend>0?money(r.spend):"—"}</td><td class="num">${c}</td><td class="num">${r.claimed>0?num(r.claimed):"—"}</td></tr>`; }).join("");
  // Booking CVR vs GA4 sessions (generic source-prefix mapping; PMax traffic reports under Cross-network)
  const ga4Cell={}; MOD.ga4.forEach(r=>ga4Cell[r.month+"|"+r.channel]=r);
  const cvrGroups=[
    {label:"Paid Search (incl PMax)", channels:["Paid Search","Cross-network"], match:s=>s.indexOf("Paid Search")===0, paid:true},
    {label:"Paid Social", channels:["Paid Social"], match:s=>s.indexOf("Paid Social")===0, paid:true}];
  let cvrBody="";
  months.slice().reverse().forEach(m=>{ cvrGroups.forEach(g=>{
    let sess=0,book=0;
    g.channels.forEach(ch=>{ const r=ga4Cell[m+"|"+ch]; if(r) sess+=r.sessions; });
    MOD.rows.forEach(r=>{ if(r.month===m&&g.match(r.source)) book+=r.bookings; });
    if(g.paid&&modCorrOn&&CORR) book*=CORR;
    if(!sess&&!book) return;
    cvrBody+=`<tr><td>${m}${m===curMonth?" (MTD)":""}</td><td>${g.label}</td><td class="num">${num(sess)}</td><td class="num">${(modCorrOn&&g.paid)?book.toFixed(1):num(book)}</td><td class="num">${sess>0?(100*book/sess).toFixed(2)+"%":"—"}</td></tr>`; }); });
  const ga4Card=MOD.ga4.length?`<div class="card"><h2>GA4 sessions by paid channel (monthly)</h2><div class="chart-wrap"><canvas id="modGa4"></canvas></div></div>
    <div class="card"><h2>${NOUN} conversion rate (${CRM.toLowerCase()==="crm"?"CRM":CRM} ${NOUN.toLowerCase()}s &divide; GA4 sessions)</h2><div style="overflow-x:auto"><table><thead><tr><th>Month</th><th>Channel</th><th class="num">GA4 Sessions</th><th class="num">${NOUN}s</th><th class="num">CVR</th></tr></thead><tbody>${cvrBody}</tbody></table></div></div>`:"";
  document.getElementById("tab-modeled").innerHTML=
    `<div class="note" style="margin-bottom:10px;">Paid sources only. ${NOUN}s are created in ${CRM}, counted once each by Create date and Original source (the truth layer). Platform-claimed conversions are reference only and are never summed across platforms. Monthly view; the date filter above does not apply.</div>
     ${corrCtl}
     <div class="kpis">${kpis}</div>
     <div class="card"><h2>Cost per ${NOUN.toLowerCase()} by source (${CRM} vs platform spend)</h2><div class="chart-wrap"><canvas id="modCpb"></canvas></div></div>
     <div class="card"><h2>${NOUN}s by source (${CRM}, monthly)</h2><div class="chart-wrap"><canvas id="modBook"></canvas></div></div>
     <div class="card"><h2>Monthly detail</h2><div class="note">Platform Claimed = what the ad platform reports for the same month; treat as directional only.</div><div style="overflow-x:auto"><table><thead><tr><th>Month</th><th>Source</th><th class="num">${NOUN}s</th><th class="num">Cancels</th><th class="num">Spend</th><th class="num">Cost/${NOUN}</th><th class="num">Platform Claimed</th></tr></thead><tbody>${tblBody}</tbody></table></div></div>
     ${ga4Card}`;
  const corrEl=document.getElementById("modCorr");
  if(corrEl) corrEl.addEventListener("change",e=>{ modCorrOn=e.target.checked; renderModeled(); });
  makeChart("modCpb",{type:"line",data:{labels:months,datasets:paidSources.filter(s=>months.some(m=>cpb(m,s)!==null)).map((s,i)=>({label:s,borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length],spanGaps:false,tension:.25,data:months.map(m=>cpb(m,s))}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:true,ticks:{callback:v=>"$"+v.toLocaleString()}}}}});
  const srcTotals={}; MOD.rows.forEach(r=>{ if(isAds(r.source)) srcTotals[r.source]=(srcTotals[r.source]||0)+r.bookings; });
  const allSources=Object.keys(srcTotals).filter(s=>srcTotals[s]>0).sort((a,b)=>srcTotals[b]-srcTotals[a]);
  makeChart("modBook",{type:"bar",data:{labels:months,datasets:allSources.map((s,i)=>({label:s,backgroundColor:COLORS[i%COLORS.length],data:months.map(m=>{const r=cellMap[m+"|"+s];return r?r.bookings:0;})}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}}}});
  if(MOD.ga4.length){
    const GA4_PAID=["Paid Search","Paid Social","Cross-network","Display","Paid Other","Paid Shopping","Paid Video"];
    const chTot={}; MOD.ga4.forEach(r=>{ if(GA4_PAID.includes(r.channel)) chTot[r.channel]=(chTot[r.channel]||0)+r.sessions; });
    const chans=Object.keys(chTot).sort((a,b)=>chTot[b]-chTot[a]);
    const top=chans.slice(0,6);
    const gaMonths=[...new Set(MOD.ga4.map(r=>r.month))].sort();
    const dsets=top.map((ch,i)=>({label:ch,backgroundColor:COLORS[i%COLORS.length],data:gaMonths.map(m=>{const r=ga4Cell[m+"|"+ch];return r?r.sessions:0;})}));
    if(chans.length>6) dsets.push({label:"Other",backgroundColor:"#BBBBBB",data:gaMonths.map(m=>chans.slice(6).reduce((t,ch)=>{const r=ga4Cell[m+"|"+ch];return t+(r?r.sessions:0);},0))});
    makeChart("modGa4",{type:"bar",data:{labels:gaMonths,datasets:dsets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}}}});
  }
}

/* ── Pipeline & Revenue: CRM deals joined to spend (optional, registry `deals`) ──
   Ported from sog.html. Spend by (month, source) comes from the modeled rows
   (MOD.rows); spend by campaign comes from this dashboard's daily ad rows
   (ROWS, Meta unless a Platform column says google). There are no keyword
   rows on the ad-ID product sheet, so the keyword breakout carries no spend.
   Follows the page's global date range (state.from / state.to). */
var DEALS_LINES = ['Design', 'Install', 'Caretaking', 'Eco Lawns'];
var DEALS_SHORT_LADDER = { 'Caretaking': true, 'Eco Lawns': true };   // Created / Won / Complete only
var DEALS_STALL_DAYS = 30;
var DEALS_MATURING_MONTHS = 3;
var DEALS_COLORS = { google: '#4A90D9', meta: '#209D50' };
// HubSpot records utm_campaign for Google; the ad platform uses its own names.
var DEALS_GOOGLE_ALIAS = {
  'pmax_callsbooked': 'PMax_Leads_CallsBooked',
  'sog nonbranded search': 'Search_NonBrand_CallsBooked',
  'sog branded search': 'Search_Brand_CallsBooked'
};
// Meta utm_campaign values set at the 2026-03-16 launch; the retargeting campaign was renamed afterwards.
var DEALS_META_ALIAS = {
  'retargeting_completeregistration': 'LeadGen_Retargeting_CallsBooked',
  'prospecting_completeregistration': 'Prospecting_CompleteRegistration'
};
function dealsAlias(plat, n) {
  var m = plat === 'google' ? DEALS_GOOGLE_ALIAS : DEALS_META_ALIAS;
  return m[n] ? dealsNormName(m[n]) : n;
}
function dealsCrmName() { return (DEALS && DEALS.crmName) || 'CRM'; }
function dealsEsc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function dealsIsPaid(b) { return (b || '').indexOf('Paid ') === 0; }
function dealsPlatform(b) {
  if (b === 'Paid Social (Meta)') return 'meta';
  if ((b || '').indexOf('Paid Search') === 0) return 'google';
  return null;
}
function dealsCanonStage(s) {
  s = (s || '').toLowerCase();
  if (s.indexOf('lost') !== -1) return 'Lost';
  if (s.indexOf('complete') !== -1) return 'Complete';
  if (s.indexOf('won') !== -1 || s === 'active') return 'Won';
  if (s.indexOf('value engineering') !== -1) return 'Value Engineering';
  if (s.indexOf('proposal sent') !== -1 || s.indexOf('pricing sent') !== -1 || s.indexOf('quote sent') !== -1) return 'Proposal Sent';
  if (s.indexOf('lead call') !== -1 || s.indexOf('call scheduled') !== -1) return 'Lead Call';
  if (s.indexOf('consultation') !== -1 || s.indexOf('schematic') !== -1) return 'Consultation';
  return s ? 'Other' : '';
}
function dealsDaysBetween(a, b) {
  if (!a || !b) return null;
  return Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);
}
function dealsShiftMonth(ym, delta) {
  var d = new Date(parseInt(ym.slice(0, 4), 10), parseInt(ym.slice(5, 7), 10) - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function dealsNormName(s) { return String(s || '').trim().toLowerCase(); }
// Cell with a background bar scaled to the column max.
function dealsBar(val, max, text) {
  var w = (max > 0 && val > 0) ? Math.max(2, Math.round(100 * val / max)) : 0;
  return '<td class="dbar"><div class="dbar-fill" style="width:' + w + '%"></div><span class="dbar-txt">' + text + '</span></td>';
}
function dealsStageFlags(r) {
  var won = r.outcome === 'Won';
  var complete = !!r.completeDate || r.cstage === 'Complete';
  var proposal = !!r.proposalDate || r.cstage === 'Proposal Sent' || r.cstage === 'Value Engineering' || won || complete;
  var leadCall = !!r.leadCallDate || proposal;
  return { leadCall: leadCall, proposal: proposal, won: won, complete: complete };
}
function dealsEmptyAgg() { return { deals: 0, lead: 0, prop: 0, won: 0, lost: 0, open: 0, wonValue: 0, spend: 0 }; }
function dealsAddDeal(a, r) {
  var f = dealsStageFlags(r);
  a.deals++;
  if (f.leadCall) a.lead++;
  if (f.proposal) a.prop++;
  if (r.outcome === 'Won') { a.won++; a.wonValue += r.value; }
  else if (r.outcome === 'Lost') a.lost++;
  else a.open++;
}
function dealsMetricCells(a, maxes) {
  var wr = a.deals ? (100 * a.won / a.deals) : null;
  return dealsBar(a.wonValue, maxes.wonValue, a.wonValue ? money(a.wonValue) : '') +
         dealsBar(a.spend, maxes.spend, a.spend ? money(a.spend) : '') +
         '<td>' + ((a.spend && a.won) ? money(a.spend / a.won) : '') + '</td>' +
         '<td>' + ((a.spend && a.wonValue) ? '$' + (a.wonValue / a.spend).toFixed(2) : '') + '</td>';
}
// Google keyword lives in drill-down 2 (kept on the sheet as "Keyword").
function dealsData_kw(r, attrib) {
  return (attrib === 'Latest' && r.latestBucket) ? (r.latestKeyword || '') : (r.keyword || '');
}

// Static tab markup (built once in buildShell so the selects keep their state across renders).
function dealsShellHtml() {
  var CRM = dealsCrmName();
  return `<div id="tab-deals" class="tab-content">
    <div class="note" style="margin-bottom:6px;">
      ${CRM} deals joined to ad spend. Paid sources are a <b>floor</b>: an ad click that arrives without campaign
      tracking is recorded as Direct and cannot be recovered. Recent months are still maturing because open deals
      have not converted yet, so read the trend, not the newest month. Revenue = the ${CRM} <b>Deal Value</b> field.
      The date range above sets the window: deals by create date, spend by month.
    </div>
    <div class="note" id="dealsAsOf" style="margin-bottom:12px;"></div>
    <div class="controls" style="gap:14px;">
      <label>Attribution
        <select class="deals-sel" id="dealsAttrib">
          <option value="Original">Original source (first touch)</option>
          <option value="Latest">Latest source (last touch)</option>
        </select></label>
    </div>

    <div class="card">
      <h2>Scorecard <span id="dealsScoreTitle" style="font-weight:400;color:var(--muted);"></span></h2>
      <div style="overflow-x:auto">
        <table class="deals-tbl" id="dealsScoreTable">
          <thead><tr><th>Channel</th><th>Deals</th><th>Won</th><th>Win Rate</th><th>Won Value</th><th>Spend</th><th>Cost / Won</th><th>Value per $1</th></tr></thead>
          <tbody id="dealsScoreBody"></tbody>
        </table>
      </div>
      <div class="note" style="margin-top:6px;" id="dealsScoreNote">Deals attributed by ${CRM} source. Win rate rises as open deals close.</div>
    </div>

    <div class="card">
      <h2>Cumulative Won Value by Month Won in the date range, Google vs Meta (dashed = maturing months)</h2>
      <div class="chart-wrap" style="height:280px;"><canvas id="chartDealsCum"></canvas></div>
    </div>

    <div class="card">
      <h2>Monthly Trend by Channel (deals grouped by the month they were created)</h2>
      <div class="note" style="margin-bottom:8px;">
        Read across to see the cycle shift. Won and value follow the deal's create month, so the newest three months
        (marked) still have open deals and will rise. Spend is the platform spend in that month.
      </div>
      <div style="overflow-x:auto">
        <table class="deals-tbl" id="dealsPivotTable">
          <thead id="dealsPivotHead"></thead>
          <tbody id="dealsPivotBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Stage Funnel by Service Line
        <select class="deals-sel" id="dealsFunnelView" style="margin-left:12px;">
          <option value="all">All paid</option>
          <option value="google">Google</option>
          <option value="meta">Meta</option>
        </select>
      </h2>
      <div class="note" style="margin-bottom:8px;">
        Paid deals created in the window. Design and Install read the full ladder. Caretaking and Eco Lawns read
        Created, Won, Complete only, because deals on those lines are usually created at the stage the work has already
        reached. A stage counts when the deal reached it or any later stage. Percentages are of Created.
      </div>
      <div style="overflow-x:auto">
        <table class="deals-tbl" id="dealsFunnelTable">
          <thead><tr><th>Service Line</th><th>Created</th><th>Lead Call</th><th>Proposal</th><th>Won</th><th>Complete</th><th>Won Value</th></tr></thead>
          <tbody id="dealsFunnelBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Breakout
        <select class="deals-sel" id="dealsDim" style="margin-left:12px;">
          <option value="line">By service line and platform</option>
          <option value="campaign">By campaign</option>
          <option value="keyword">By Google keyword</option>
          <option value="ad" id="dealsDimAd" disabled>By Meta ad (needs the click-to-ad map)</option>
        </select>
      </h2>
      <div class="note" style="margin-bottom:8px;" id="dealsDimNote"></div>
      <div style="overflow-x:auto">
        <table class="deals-tbl" id="dealsDimTable">
          <thead><tr><th>Row</th><th>Platform</th><th>Deals</th><th>Lead Call</th><th>Proposal</th><th>Won</th><th>Win Rate</th><th>Won Value</th><th>Spend</th><th>Cost / Won</th><th>Value per $1</th></tr></thead>
          <tbody id="dealsDimBody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderDeals() {
  var CRM = dealsCrmName();
  var ctl = ['dealsAttrib', 'dealsFunnelView', 'dealsDim'].map(function(id) {
    var el = document.getElementById(id); el.onchange = renderDeals; return el;
  });
  var attrib = ctl[0].value, funnelView = ctl[1].value, dim = ctl[2].value;

  var asOfEl = document.getElementById('dealsAsOf');

  var adOptEl = document.getElementById('dealsDimAd'); if (adOptEl) { var hasAds = dealsData.some(function(r) { return r.ad; }); adOptEl.disabled = !hasAds; adOptEl.textContent = hasAds ? 'By Meta ad' : 'By Meta ad (needs the click-to-ad map)'; }
  if (!dealsData.length) { asOfEl.textContent = 'No deal data loaded yet (' + ((DEALS && DEALS.dealsTab) || 'HS Deals') + ' tab is empty or could not be read).'; return; }
  asOfEl.textContent = 'Deal data as of ' + (dealsData[0].asOf || '') + ' via ' + dealsData[0].dataSource + '. ' +
    num(dealsData.length) + ' deals in ' + CRM + '.';

  var todayStr = fmtDate(new Date());
  var curMonth = todayStr.slice(0, 7);
  var maturingFrom = dealsShiftMonth(curMonth, -(DEALS_MATURING_MONTHS - 1));
  // First month with modeled spend (sog.html hardcodes 2026-01; derived here so other clients work).
  var modMonths = MOD.rows.map(function(m) { return m.month; }).sort();
  var spendStart = modMonths.length ? modMonths[0] : curMonth.slice(0, 4) + '-01';
  var winFrom = state.from || spendStart + '-01';
  var winTo = state.to || todayStr;
  var winToMonth = winTo.slice(0, 7) < curMonth ? winTo.slice(0, 7) : curMonth;
  document.getElementById('dealsScoreTitle').textContent = '(deals created ' + winFrom + ' to ' + winTo + ')';
  document.getElementById('dealsScoreNote').textContent = 'Deals attributed by ' + CRM + ' source. Win rate rises as open deals close.' +
    (winFrom < spendStart + '-01' ? ' Spend on this sheet starts ' + monthLabel(spendStart) + ', so deals created before that carry no spend and cost figures read low.' : '');

  // Attribution view + paid-only working set
  var deals = dealsData.map(function(r) {
    var useLatest = attrib === 'Latest' && r.latestBucket;
    return { r: r, vb: useLatest ? r.latestBucket : r.bucket, vc: useLatest ? r.latestCampaign : r.campaign,
             plat: dealsPlatform(useLatest ? r.latestBucket : r.bucket) };
  });
  var paid = deals.filter(function(d) { return d.plat; });
  var inWin = paid.filter(function(d) { return d.r.created >= winFrom && d.r.created <= winTo; });
  // Service lines: the SOG order first, then any other line present on paid deals.
  var lines = DEALS_LINES.slice();
  paid.forEach(function(d) { if (d.r.line && lines.indexOf(d.r.line) === -1) lines.push(d.r.line); });

  // Spend: by (month, bucket) from the modeled rows; by campaign from this dashboard's daily ad rows.
  // No keyword rows exist on the ad-ID product sheet, so kwSpendWin stays empty.
  var spendBucket = {}, spendPlat = {};
  MOD.rows.forEach(function(m) {
    spendBucket[m.month + '|' + m.source] = (spendBucket[m.month + '|' + m.source] || 0) + m.spend;
    var p = dealsPlatform(m.source) || (m.source === 'Google - Other' ? 'google' : null);
    if (p) spendPlat[m.month + '|' + p] = (spendPlat[m.month + '|' + p] || 0) + m.spend;
  });
  // Platform spend inside the exact date range from this dashboard's daily ad rows (the modeled
  // rows are monthly and would overstate spend for a partial month).
  function spendPlatWindow(p) {
    var t = 0;
    ROWS.forEach(function(c) {
      if (!c._date || c._date < winFrom || c._date > winTo) return;
      var plat = String(c["Platform"] || 'meta').trim().toLowerCase() === 'google' ? 'google' : 'meta';
      if (plat === p) t += c._spend;
    });
    return t;
  }
  var campSpendWin = {};
  ROWS.forEach(function(c) {
    if (!c._date || !c["Campaign"]) return;
    var plat = String(c["Platform"] || 'meta').trim().toLowerCase() === 'google' ? 'google' : 'meta';
    var key = plat + '|' + dealsNormName(c["Campaign"]);
    if (c._date >= winFrom && c._date <= winTo) campSpendWin[key] = (campSpendWin[key] || 0) + c._spend;
  });
  var kwSpendWin = {};
  function platformCampaignName(d) {
    return dealsAlias(d.plat, dealsNormName(d.vc));
  }

  // ── Scorecard ──
  var score = { google: dealsEmptyAgg(), meta: dealsEmptyAgg(), all: dealsEmptyAgg() };
  inWin.forEach(function(d) { dealsAddDeal(score[d.plat], d.r); dealsAddDeal(score.all, d.r); });
  score.google.spend = spendPlatWindow('google'); score.meta.spend = spendPlatWindow('meta');
  score.all.spend = score.google.spend + score.meta.spend;
  var sMax = { wonValue: Math.max(score.google.wonValue, score.meta.wonValue), spend: Math.max(score.google.spend, score.meta.spend) };
  document.getElementById('dealsScoreBody').innerHTML = [['Google (Paid search)', score.google], ['Meta (Paid social)', score.meta], ['All paid', score.all]].map(function(x, i) {
    var a = x[1];
    return '<tr' + (i === 2 ? ' style="font-weight:600;"' : '') + '><td>' + x[0] + '</td><td>' + num(a.deals) + '</td><td>' + num(a.won) +
      '</td><td>' + (a.deals ? (100 * a.won / a.deals).toFixed(0) + '%' : '') + '</td>' + dealsMetricCells(a, i === 2 ? { wonValue: 0, spend: 0 } : sMax) + '</tr>';
  }).join('');

  // ── Cumulative won value by month won (paid, months inside the date range) ──
  var months = [];
  for (var ym = winFrom.slice(0, 7); ym <= winToMonth; ym = dealsShiftMonth(ym, 1)) months.push(ym);
  var wonByMonth = { google: {}, meta: {} };
  paid.forEach(function(d) {
    if (d.r.outcome !== 'Won') return;
    var m = (d.r.wonDate || d.r.closeDate || '').slice(0, 7);
    if (m && m >= winFrom.slice(0, 7) && m <= winToMonth) wonByMonth[d.plat][m] = (wonByMonth[d.plat][m] || 0) + d.r.value;
  });
  function cumulative(p) {
    var t = 0;
    return months.map(function(m) { t += wonByMonth[p][m] || 0; return Math.round(t); });
  }
  makeChart('chartDealsCum', {
    type: 'line',
    data: { labels: months, datasets: [['google', 'Google'], ['meta', 'Meta']].map(function(x) {
      return { label: x[1], data: cumulative(x[0]), borderColor: DEALS_COLORS[x[0]], backgroundColor: DEALS_COLORS[x[0]],
               pointRadius: 3, tension: 0.15, borderWidth: 2, fill: false,
               segment: { borderDash: function(c) { return months[c.p1DataIndex] >= maturingFrom ? [6, 4] : undefined; } } };
    }) },
    options: { responsive: true, maintainAspectRatio: false,
      scales: { y: { beginAtZero: true, ticks: { callback: function(v) { return '$' + num(v); } } } },
      plugins: { legend: { position: 'bottom' },
                 tooltip: { callbacks: { label: function(c) { return c.dataset.label + ': ' + money(c.parsed.y) + ' cumulative'; } } } } }
  });

  // ── Monthly trend pivot: months across, metric rows per channel (cohort by create month) ──
  var pv_ = { google: {}, meta: {} };
  months.forEach(function(m) { pv_.google[m] = dealsEmptyAgg(); pv_.meta[m] = dealsEmptyAgg(); });
  paid.forEach(function(d) { var m = d.r.createdMonth; if (pv_[d.plat][m]) dealsAddDeal(pv_[d.plat][m], d.r); });
  Object.keys(spendPlat).forEach(function(k) { var m = k.slice(0, 7), p = k.split('|')[1]; if (pv_[p] && pv_[p][m]) pv_[p][m].spend = spendPlat[k]; });
  var mLabel = function(m) {
    var d = new Date(parseInt(m.slice(0, 4), 10), parseInt(m.slice(5, 7), 10) - 1, 1);
    var t = d.toLocaleString('en-US', { month: 'short' }) + ' ' + m.slice(2, 4);
    if (m === curMonth) t += '<div style="font-size:10px;font-weight:400;color:var(--muted);">MTD</div>';
    else if (m >= maturingFrom) t += '<div style="font-size:10px;font-weight:400;color:var(--muted);">maturing</div>';
    return t;
  };
  document.getElementById('dealsPivotHead').innerHTML = '<tr><th style="min-width:150px;"></th>' + months.map(function(m) { return '<th style="text-align:right;">' + mLabel(m) + '</th>'; }).join('') + '</tr>';
  var metrics = [
    { k: 'deals', label: 'Deals created', f: function(a) { return num(a.deals); } },
    { k: 'won', label: 'Won so far', f: function(a) { return num(a.won); } },
    { k: 'wr', label: 'Win rate', f: function(a) { return a.deals ? (100 * a.won / a.deals).toFixed(0) + '%' : ''; } },
    { k: 'wonValue', label: 'Won value', f: function(a) { return a.wonValue ? money(a.wonValue) : ''; }, bar: true },
    { k: 'spend', label: 'Spend', f: function(a) { return a.spend ? money(a.spend) : ''; }, bar: true },
    { k: 'cpw', label: 'Cost per won deal', f: function(a) { return (a.spend && a.won) ? money(a.spend / a.won) : ''; } },
    { k: 'vps', label: 'Value per $1 spend', f: function(a) { return (a.spend && a.wonValue) ? '$' + (a.wonValue / a.spend).toFixed(2) : ''; } }
  ];
  var pivotHtml = '';
  [['google', 'Google'], ['meta', 'Meta']].forEach(function(ch, ci) {
    var rows = pv_[ch[0]];
    pivotHtml += '<tr' + (ci ? ' style="border-top:2px solid var(--border);"' : '') + '><td colspan="' + (months.length + 1) + '" style="font-weight:600;color:' + DEALS_COLORS[ch[0]] + ';padding-top:10px;">' + ch[1] + '</td></tr>';
    metrics.forEach(function(mt) {
      var max = 0;
      if (mt.bar) months.forEach(function(m) { max = Math.max(max, rows[m][mt.k]); });
      pivotHtml += '<tr><td style="padding-left:20px;color:var(--muted);">' + mt.label + '</td>' + months.map(function(m) {
        var a = rows[m];
        return mt.bar ? dealsBar(a[mt.k], max, mt.f(a)).replace('<td class="dbar">', '<td class="dbar" style="text-align:right;">')
                      : '<td style="text-align:right;">' + mt.f(a) + '</td>';
      }).join('') + '</tr>';
    });
  });
  document.getElementById('dealsPivotBody').innerHTML = pivotHtml;

  // ── Funnel by service line, view: all / google / meta ──
  var fdeals = inWin.filter(function(d) { return funnelView === 'all' || d.plat === funnelView; });
  var funnel = {};
  var frows = funnelView === 'all' ? ['Google', 'Meta'].concat(lines) : lines;
  frows.forEach(function(l) { funnel[l] = { created: 0, lead: 0, prop: 0, won: 0, complete: 0, wonValue: 0 }; });
  fdeals.forEach(function(d) {
    var r = d.r, f = dealsStageFlags(r);
    var targets = [r.line];
    if (funnelView === 'all') targets.push(d.plat === 'google' ? 'Google' : 'Meta');
    targets.forEach(function(t) {
      var a = funnel[t]; if (!a) return;
      a.created++;
      if (f.leadCall) a.lead++;
      if (f.proposal) a.prop++;
      if (f.won) { a.won++; a.wonValue += r.value; }
      if (f.complete) a.complete++;
    });
  });
  var fMax = { created: 0, wonValue: 0 };
  frows.forEach(function(l) { fMax.created = Math.max(fMax.created, funnel[l].created); fMax.wonValue = Math.max(fMax.wonValue, funnel[l].wonValue); });
  function fcell(l, key, n) {
    if (DEALS_SHORT_LADDER[l] && (key === 'lead' || key === 'prop')) return '<td style="color:#bbb;">n/a</td>';
    var c = funnel[l].created;
    var pct = (key !== 'created' && c) ? ' <span style="color:var(--muted);font-size:11px;">' + (100 * n / c).toFixed(0) + '%</span>' : '';
    return dealsBar(n, fMax.created, num(n) + pct);
  }
  document.getElementById('dealsFunnelBody').innerHTML = frows.map(function(l, i) {
    var a = funnel[l];
    var isPlat = funnelView === 'all' && i < 2;
    var sep = (funnelView === 'all' && i === 2) ? ' style="border-top:2px solid var(--border);"' : '';
    return '<tr' + sep + '><td' + (isPlat ? ' style="font-weight:600;color:' + DEALS_COLORS[l.toLowerCase()] + ';"' : '') + '>' + dealsEsc(l) + '</td>' +
      fcell(l, 'created', a.created) + fcell(l, 'lead', a.lead) + fcell(l, 'prop', a.prop) + fcell(l, 'won', a.won) + fcell(l, 'complete', a.complete) +
      dealsBar(a.wonValue, fMax.wonValue, a.wonValue ? money(a.wonValue) : '') + '</tr>';
  }).join('');

  // ── Breakout by dimension ──
  var brows = {}, bMeta = {};
  var note = '';
  inWin.forEach(function(d) {
    var r = d.r, key, label, platLabel = d.plat === 'google' ? 'Google' : 'Meta', spendKey = null;
    if (dim === 'campaign') {
      label = d.vc || '(no campaign recorded)'; key = d.plat + '|' + dealsNormName(label); spendKey = campSpendWin[d.plat + '|' + platformCampaignName(d)];
    } else if (dim === 'keyword') {
      if (d.plat !== 'google') return;
      var kwRaw = dealsData_kw(r, attrib);
      var isPmax = dealsNormName(d.vc).indexOf('pmax') !== -1;
      label = isPmax ? 'PMax (no keyword)' : (kwRaw && kwRaw.indexOf('Unknown keywords') === -1 && !/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(kwRaw) ? kwRaw : '(no keyword)');
      key = 'google|' + label; spendKey = kwSpendWin[dealsNormName(label)];
    } else if (dim === 'line') {
      label = r.line; key = d.plat + '|' + label; spendKey = null;
    } else if (dim === 'ad') {
      if (d.plat !== 'meta') return;
      label = r.ad || '(ad not logged)'; key = 'meta|' + label; spendKey = null;
    } else return;
    if (!brows[key]) { brows[key] = dealsEmptyAgg(); bMeta[key] = { label: label, plat: platLabel }; brows[key].spend = spendKey || 0; }
    else if (dim === 'campaign' && label !== label.toLowerCase() && bMeta[key].label === bMeta[key].label.toLowerCase()) bMeta[key].label = label;
    dealsAddDeal(brows[key], r);
  });
  if (dim === 'campaign') note = 'Campaign as recorded by ' + CRM + '. Spend joins to this dashboard\'s daily ad rows by campaign name (mapped: pmax_callsbooked, sog nonbranded search, sog branded search, retargeting_completeregistration). Campaigns with no ad rows here in the window show no cost; the scorecard carries platform-level spend.';
  if (dim === 'keyword') note = 'Google deals only. PMax has no keywords, so its deals sit on one row. This dashboard has no keyword spend rows, so cost columns are blank here.';
  if (dim === 'line') note = 'Service line by platform. Spend is not split by service line, so cost columns are blank here; use the scorecard for cost.';
  if (dim === 'ad') note = 'Meta deals by the ad the contact clicked, read from the contact\'s first-visit URL in the CRM. Ad-level spend is not joined here; use the campaign view for cost.';
  document.getElementById('dealsDimNote').textContent = note;
  var bKeys = Object.keys(brows).sort(function(a, b) { return brows[b].deals - brows[a].deals || brows[b].wonValue - brows[a].wonValue; });
  var bMax = { wonValue: 0, spend: 0, deals: 0 };
  bKeys.forEach(function(k) { bMax.wonValue = Math.max(bMax.wonValue, brows[k].wonValue); bMax.spend = Math.max(bMax.spend, brows[k].spend); bMax.deals = Math.max(bMax.deals, brows[k].deals); });
  document.getElementById('dealsDimBody').innerHTML = bKeys.map(function(k) {
    var a = brows[k], m = bMeta[k];
    return '<tr><td>' + dealsEsc(m.label) + '</td><td style="color:' + DEALS_COLORS[m.plat.toLowerCase()] + ';">' + m.plat + '</td>' +
      dealsBar(a.deals, bMax.deals, num(a.deals)) + '<td>' + num(a.lead) + '</td><td>' + num(a.prop) + '</td><td>' + num(a.won) +
      '</td><td>' + (a.deals ? (100 * a.won / a.deals).toFixed(0) + '%' : '') + '</td>' + dealsMetricCells(a, bMax) + '</tr>';
  }).join('') || '<tr><td colspan="11" style="color:var(--muted);">Nothing in the window.</td></tr>';
}

function renderPacing(f){
  // pacing is month-to-date for the current month vs an entered budget
  const today=DMAX; const ym=today.slice(0,7); const monthStart=ym+"-01";
  const mtdRows=ROWS.filter(r=>r._date>=monthStart && r._date<=today);
  const mtd=agg(mtdRows).spend;
  const dayNum=+today.slice(8,10); const daysInMonth=new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
  const projected=dayNum?mtd/dayNum*daysInMonth:0;
  // Precedence: budget typed into the page > sheet Budgets tab > client config.
  const sheetBudget=monthlyBudgetFor(ym);
  const budget=+(localStorage.getItem("adsBudget_"+CLIENT_KEY)||sheetBudget||CFG.monthlyBudget||0);
  const pacePct=budget?projected/budget*100:0;
  const status=!budget?"—":projected>budget*1.05?"OVER PACE":projected<budget*0.9?"UNDER PACE":"ON TRACK";
  const statusColor=status==="OVER PACE"?"var(--bad)":status==="UNDER PACE"?"#FFA500":"var(--good)";
  document.getElementById("tab-pacing").innerHTML=
    `<div class="card"><h2>Budget Pacing — ${ym}
      <label style="float:right;font-size:13px;font-weight:400;">Monthly budget $<input type="number" id="pcBudget" value="${budget||""}" placeholder="0" style="width:110px;font:inherit;padding:4px 7px;border:1px solid var(--border);border-radius:6px;"></label></h2>
      <div class="kpis">
        <div class="kpi"><div class="label">Spent (MTD)</div><div class="val">${money(mtd)}</div></div>
        <div class="kpi"><div class="label">Projected EOM</div><div class="val">${money(projected)}</div></div>
        <div class="kpi"><div class="label">Budget</div><div class="val">${budget?money(budget):"—"}</div></div>
        <div class="kpi"><div class="label">Status</div><div class="val" style="color:${statusColor};font-size:20px;">${status}</div></div>
      </div>
      <div style="background:var(--header-bg);border-radius:9px;height:26px;overflow:hidden;margin-top:6px;">
        <div style="height:100%;width:${Math.min(pacePct,100)}%;background:${statusColor};"></div></div>
      <div class="note">${budget?`Projected ${pacePct.toFixed(0)}% of budget · day ${dayNum} of ${daysInMonth}`+(localStorage.getItem("adsBudget_"+CLIENT_KEY)?" · manual override (clear the box to use the sheet)":sheetBudget?" · from the sheet's Budgets tab":""):"Enter a monthly budget here, or add a row to the sheet's Budgets tab (Month, Budget)."}</div>
    </div>`;
  document.getElementById("pcBudget").addEventListener("change",e=>{ localStorage.setItem("adsBudget_"+CLIENT_KEY, e.target.value||""); renderPacing(filtered()); });
}

function kpiHtml(f){
  const t=agg(f);
  // previous window of equal length, immediately before the selected range
  const spanDays=Math.round((new Date(state.to+"T00:00:00")-new Date(state.from+"T00:00:00"))/86400000)+1;
  const pTo=shiftDays(state.from,1), pFrom=shiftDays(state.from,spanDays);
  const pRows=state.cmp?scoped().filter(r=>r._date>=pFrom&&r._date<=pTo):[];
  const pAgg=pRows.length?agg(pRows):null;
  function kd(cur,prev,invert,absFmt){
    if(!pAgg||prev==null||!isFinite(prev)||prev===0) return "";
    const diff=cur-prev, pct=diff/Math.abs(prev);
    const cls=Math.abs(pct)<0.001?"neutral":(invert?pct<=0:pct>=0)?"good":"bad";
    const abs=absFmt?` (${diff>=0?"+":"\u2212"}${absFmt(Math.abs(diff))})`:"";
    return `<div class="kpi-delta ${cls}">${pct>=0?"+":""}${(pct*100).toFixed(1)}% ${pct>=0?"\u2191":"\u2193"}${abs}</div>`;
  }
  const resultK=IS_ROAS
    ? `<div class="kpi"><div class="label">Blended ROAS</div><div class="val">${t.roas.toFixed(2)}x</div>${kd(t.roas,pAgg&&pAgg.roas,false)}</div>
       <div class="kpi"><div class="label">CPA</div><div class="val">${t.leads?money(t.cpa):"—"}</div>${kd(t.cpa,pAgg&&pAgg.cpa,true,money)}</div>
       <div class="kpi"><div class="label">AOV</div><div class="val">${t.leads?money(t.aov):"—"}</div>${kd(t.aov,pAgg&&pAgg.aov,false,money)}</div>
       <div class="kpi"><div class="label">Revenue</div><div class="val">${money(t.rev)}</div>${kd(t.rev,pAgg&&pAgg.rev,false,money)}</div>
       <div class="kpi"><div class="label">${RESULT_LABEL}</div><div class="val">${num(t.leads)}</div>${kd(t.leads,pAgg&&pAgg.leads,false,num)}</div>`
    : `<div class="kpi"><div class="label">${RESULT_LABEL}</div><div class="val">${num(t.leads)}</div>${kd(t.leads,pAgg&&pAgg.leads,false,num)}</div>
       <div class="kpi"><div class="label">Blended CPA</div><div class="val">${money(t.cpa)}</div>${kd(t.cpa,pAgg&&pAgg.cpa,true,money)}</div>`;
  return `<div class="kpis">
    <div class="kpi"><div class="label">Total Spend</div><div class="val">${money(t.spend)}</div>${kd(t.spend,pAgg&&pAgg.spend,false,money)}</div>
    ${resultK}
    <div class="kpi"><div class="label">Active Ads</div><div class="val">${t.ads}</div>${kd(t.ads,pAgg&&pAgg.ads,false)}</div></div>`;
}

function makeChart(id,cfg){ if(charts[id])charts[id].destroy(); const el=document.getElementById(id); if(el)charts[id]=new Chart(el,cfg); }
function dailySeries(rows){
  const by={}; rows.forEach(r=>{ const d=r._date; const b=by[d]=by[d]||{spend:0,leads:0,rev:0}; b.spend+=r._spend; b.leads+=r._leads; b.rev+=r._rev; });
  const days=Object.keys(by).sort();
  return {days, spend:days.map(d=>by[d].spend), result:days.map(d=>IS_ROAS?by[d].rev:by[d].leads)};
}

/* ── Overview period tables: week-over-week + month-over-month, all campaigns ── */
const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function weekKey(d){ const x=new Date(d+"T00:00:00"); if(isNaN(x))return d; const day=x.getDay(); x.setDate(x.getDate()-(day===0?6:day-1)); return fmtDate(x); }
function monthKey(d){ return String(d).slice(0,7); }
function monthLabel(k){ const p=k.split("-"); return p.length===2?(MONTH_NAMES[+p[1]-1]||p[1])+" "+p[0]:k; }
// % change vs the previous (older) period; invert flips good/bad for cost metrics.
function periodDelta(cur,prev,invert,absFmt){
  if(prev==null||!isFinite(prev)||prev===0) return "";
  const diff=cur-prev, pct=diff/Math.abs(prev);
  const cls=Math.abs(pct)<0.001?"neutral":(invert?pct<=0:pct>=0)?"good":"bad";
  const abs=absFmt?` (${diff>=0?"+":"−"}${absFmt(Math.abs(diff))})`:"";
  return `<span class="tbl-delta ${cls}">${pct>=0?"+":""}${(pct*100).toFixed(1)}% ${pct>=0?"↑":"↓"}${abs}</span>`;
}
// Like-for-like period comparison (Amy, 2026-09-17): a partial period (this week so far, month to
// date, or a period clipped by the date filter) is compared with the SAME days of the previous
// period, never with the whole previous period.
function periodStart(key, isMonth) { return isMonth ? key + '-01' : key; }
function dayDiff(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function periodOffset(key, isMonth, ds) { return dayDiff(periodStart(key, isMonth), ds); }
function periodWindow(key, isMonth, fMin, fMax) {
  const s = periodStart(key, isMonth);
  const len = isMonth ? new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate() : 7;
  const lo = Math.max(0, dayDiff(s, fMin)), hi = Math.min(len - 1, dayDiff(s, fMax));
  return { lo: lo, hi: hi, len: len, days: hi - lo + 1, partial: (hi - lo + 1) < len };
}
// Key of the period immediately before `key` (week keys are Monday dates, month keys are YYYY-MM).
function prevPeriodKey(key, isMonth) {
  if (isMonth) { const y = +key.slice(0, 4), m = +key.slice(5, 7); return m === 1 ? (y - 1) + '-12' : y + '-' + String(m - 1).padStart(2, '0'); }
  const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() - 7);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function periodTable(rows,keyFn,colLabel,labelFn){
  const isMonth=keyFn===monthKey; let fMin=null,fMax=null; rows.forEach(r=>{ if(!fMin||r._date<fMin)fMin=r._date; if(!fMax||r._date>fMax)fMax=r._date; });
  const allByKey={}; scoped().forEach(r=>{ const k=keyFn(r._date); (allByKey[k]=allByKey[k]||[]).push(r); });
  const g={}; rows.forEach(r=>{ const k=keyFn(r._date); (g[k]=g[k]||[]).push(r); });
  const out=Object.entries(g).map(([k,rs])=>({k,...agg(rs),ctr:0})).sort((a,b)=>b.k.localeCompare(a.k));
  out.forEach(x=>{ x.ctr=x.imp?x.clicks/x.imp*100:0; });
  const rh=IS_ROAS?`<th class="num">Revenue</th><th class="num">ROAS</th><th class="num">CPA</th><th class="num">AOV</th>`:`<th class="num">${RESULT_LABEL}</th><th class="num">CPA</th>`;
  const body=out.map((x,i)=>{
    // Comparison period comes from ALL data (campaign / ad set filters kept, date filter dropped), so a
    // period still gets its change when the prior period sits outside the selected dates.
    let p=null, lfl="";
    const w=fMin?periodWindow(x.k,isMonth,fMin,fMax):null;
    if(w){ const pk=prevPeriodKey(x.k,isMonth);
      const slice=(allByKey[pk]||[]).filter(r=>{ if(!w.partial) return true; const o=periodOffset(pk,isMonth,r._date); return o>=w.lo&&o<=w.hi; });
      if(slice.length){ p={k:pk,...agg(slice)}; p.ctr=p.imp?p.clicks/p.imp*100:0; }
      if(w.partial) lfl=`<span class="tbl-delta neutral">${w.days} of ${w.len} days, vs same days prior ${isMonth?"month":"week"}</span>`; }
    const d=(cur,prev,inv,absFmt)=>p?periodDelta(cur,prev,inv,absFmt):"";
    return `<tr><td>${labelFn?labelFn(x.k):x.k}${lfl}</td><td class="num">${money(x.spend)}${d(x.spend,p&&p.spend,false,money)}</td><td class="num">${num(x.imp)}</td>`+
      `<td class="num">${num(x.clicks)}${d(x.clicks,p&&p.clicks,false,num)}</td><td class="num">${x.ctr.toFixed(2)}%${d(x.ctr,p&&p.ctr,false)}</td>`+
      (IS_ROAS?`<td class="num">${money(x.rev)}${d(x.rev,p&&p.rev,false,money)}</td><td class="num">${x.rev?x.roas.toFixed(2)+"x":"—"}${d(x.roas,p&&p.roas,false)}</td><td class="num">${x.leads?money(x.cpa):"—"}${x.leads&&p&&p.leads?periodDelta(x.cpa,p.cpa,true,money):""}</td><td class="num">${x.leads?money(x.aov):"—"}${x.leads&&p&&p.leads?periodDelta(x.aov,p.aov,false,money):""}</td>`
              :`<td class="num">${num(x.leads)||"—"}${d(x.leads,p&&p.leads,false,num)}</td><td class="num">${x.leads?money(x.cpa):"—"}${x.leads&&p&&p.leads?periodDelta(x.cpa,p.cpa,true,money):""}</td>`)+`</tr>`;
  }).join("");
  return `<table><thead><tr><th>${colLabel}</th><th class="num">Spend</th><th class="num">Impr</th><th class="num">Clicks</th><th class="num">CTR</th>${rh}</tr></thead><tbody>${body}</tbody></table>`;
}

let bdDim=BREAKDOWN_DIMS[0], bdView="coverage", bdMin=500, bdA="", bdB="";
function specialBrkRows(dim){

  if(dim==="Hour of Day") return BRK.hourly;
  if(dim==="PMax Channel") return BRK.pmax;

}
// Scoring follows the client's metric: ROAS (higher is better) or cost per result (lower is better).
const resHeadHtml=()=>IS_ROAS?`<th class="num">Revenue</th><th class="num">ROAS</th><th class="num">CPA</th><th class="num">AOV</th>`:`<th class="num">${RESULT_LABEL}</th><th class="num">CPA</th>`;
const resCellsHtml=x=>IS_ROAS?`<td class="num">${money(x.rev)}</td><td class="num">${x.rev?x.roas.toFixed(2)+"x":"—"}</td><td class="num">${x.leads?money(x.cpa):"—"}</td><td class="num">${x.leads?money(x.aov):"—"}</td>`
  :`<td class="num">${num(x.leads)||"—"}</td><td class="num">${x.leads?money(x.cpa):"—"}</td>`;
const scoreTxt=x=>IS_ROAS?(x.rev?x.roas.toFixed(2)+"x":"—"):(x.leads?money(x.cpa):"no "+RESULT_LABEL.toLowerCase());
const scoreCls=(x,t)=>IS_ROAS?(!x.rev?"":x.roas>=t.roas*1.1?"good":x.roas<t.roas*0.8?"bad":""):(!x.leads||!t.cpa?"":x.cpa<=t.cpa*0.9?"good":x.cpa>=t.cpa*1.25?"bad":"");
const rankBest=(a,b)=>IS_ROAS?((a.rev&&b.rev)?b.roas-a.roas:(a.rev?-1:b.rev?1:b.spend-a.spend)):((a.leads&&b.leads)?a.cpa-b.cpa:(a.leads?-1:b.leads?1:b.spend-a.spend));
const SCORE_NAME=IS_ROAS?"ROAS":"cost per "+RESULT_ONE;
const SCORE_RULE=IS_ROAS?"Green = at least 10% above it, red = more than 20% below.":"Green = at least 10% cheaper than that, red = at least 25% more expensive.";
function bdBar(extra){
  const seg=[["coverage","Themes"],["detail","Theme detail"]].map(([k,l])=>`<button data-bdv="${k}" class="${bdView===k?"on":""}">${l}</button>`).join("");
  return `<div class="bd-bar"><span class="seg">${seg}</span>${extra||""}
    <label>Min spend $ <input type="number" id="bdMinIn" value="${bdMin}" style="width:80px;"></label>

}
function detailPickers(){

  const o2=`<option value="">None</option>`+BREAKDOWN_DIMS.filter(d=>!specialBrkRows(d)&&d!==bdDim).map(d=>`<option value="${d}"${d===bdB?" selected":""}>${d}</option>`).join("");

function wireDetailPickers(){

function wireBdBar(){

  const m=document.getElementById("bdMinIn"); if(m) m.addEventListener("change",e=>{bdMin=Math.max(0,+e.target.value||0); renderBreakdowns(filtered());});

/* Deal outcomes for the Meta ads in a set of rows: CRM deals whose contact first clicked one of
   those ads (deals tab "Ad" column), created inside the page's date range. Used by the theme views. */
function dealsForRows(rows){
  const names={}; rows.forEach(r=>{ const n=(r["Ad Name"]||"").toString().trim().toLowerCase(); if(n) names[n]=1; });
  const out={deals:0,won:0,wonValue:0};
  if(!Object.keys(names).length) return out;
  dealsData.forEach(d=>{ if(!d.ad||d.bucket!=="Paid Social (Meta)") return;
    if(!names[String(d.ad).trim().toLowerCase()]) return;
    if((state.from&&d.created<state.from)||(state.to&&d.created>state.to)) return;
    out.deals++; if(d.outcome==="Won"){ out.won++; out.wonValue+=d.value; } });
  return out;
}
function dealsLine(x){ return x.deals?`${num(x.deals)} deal${x.deals===1?"":"s"} · ${num(x.won)} won${x.wonValue?" · "+money(x.wonValue):""}`:""; }
function renderBreakdowns(f){
  if(bdView==="coverage") return renderCoverage(f);
  if(bdB && bdB!==bdDim && !specialBrkRows(bdDim)){ bdA=bdDim; return renderCombo(f); }
  const sp=specialBrkRows(bdDim); let spNote="";
  if(sp){ f=sp.filter(r=>r._date>=state.from && r._date<=state.to && (!state.campaign||!r.Campaign||r.Campaign===state.campaign));
    if(state.adset||(state.campaign&&bdDim==="Hour of Day")) spNote=`<div class="note" style="margin:-4px 0 12px;">${bdDim} is not available by ${bdDim==="Hour of Day"&&state.campaign?"campaign or ad set":"ad set"}, so that filter does not apply to it.</div>`; }
  const g=groupBy(f,bdDim);
  let out=Object.entries(g).map(([k,rows])=>({k,...agg(rows),...dealsForRows(rows)}));
  out=out.filter(x=>x.k!=="(none)" || out.length===1);
  if(bdDim==="Hour of Day") out.sort((a,b)=>a.k<b.k?-1:1); else out.sort(rankBest);
  // Deal outcome columns only when this client has a deals tab loaded.
  const hasDeals=dealsData.length>0;
  const dealsHead=hasDeals?`<th class="num" title="${dealsCrmName()} deals created in these dates whose contact first clicked a Meta ad in this group">Deals</th><th class="num">Won</th><th class="num">Won Value</th>`:"";
  const dealsCells=x=>hasDeals?`<td class="num">${x.deals?num(x.deals):""}</td><td class="num">${x.won?num(x.won):""}</td><td class="num">${x.wonValue?money(x.wonValue):""}</td>`:"";
  const body=out.map(x=>`<tr${x.spend<bdMin?' style="color:var(--muted)"':""}><td>${x.k}${x.spend<bdMin?' <span class="pill">low spend</span>':""}</td><td class="num">${money(x.spend)}</td>${resCellsHtml(x)}${dealsCells(x)}</tr>`).join("");
  document.getElementById("tab-breakdowns").innerHTML=bdBar(detailPickers())+spNote+
    `<div class="card"><h2>${bdDim}</h2><div class="note" style="margin:-8px 0 10px;">${THEME_Q[bdDim]||(THEMES.find(t=>t.dim===bdDim)||{}).hint||""}</div>
       <div class="chart-wrap" style="height:280px;"><canvas id="bdChart"></canvas></div></div>
     <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>${bdDim}</th><th class="num">Spend</th>${resHeadHtml()}${dealsHead}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  wireDetailPickers(); wireBdBar(); dimChart("bdChart",out);
}
function renderCoverage(f){
  const tot=agg(f);
  const themeHtml=(t,src)=>{
    const g=groupBy(src,t.dim); const seen=Object.keys(g).filter(k=>k!=="(none)");
    const vals=t.values.length?t.values.concat(seen.filter(k=>!t.values.includes(k))):seen;
    const boxes=vals.map(v=>{ const x=agg(g[v]||[]);
      if(!x.spend) return NEUTRAL.has(v)?"":`<div class="cov-box gap"><div class="l">${v}</div><div class="n">Nothing running here.</div></div>`;
      if(x.spend<bdMin) return `<div class="cov-box low"><div class="l">${v}</div><div class="n">${money(x.spend)} spent. Too little to judge.</div></div>`;
      const share=tot.spend?x.spend/tot.spend*100:0, dl=dealsLine(dealsForRows(g[v]||[]));

        <div class="r"><span>${share.toFixed(0)}% of spend</span><span class="v ${scoreCls(x,tot)}">${scoreTxt(x)}</span></div>
        <div class="n">${money(x.spend)} · ${num(x.leads)} ${RESULT_LABEL.toLowerCase()} · ${x.ads} ad${x.ads===1?"":"s"}</div>${dl?`<div class="n" style="color:var(--good);font-weight:600;">${dl}</div>`:""}</div>`; }).join("");
    const un=agg(g["(none)"]||[]);
    return `<div class="cov-theme"><h3>${t.dim}</h3><div class="q">${THEME_Q[t.dim]||t.hint||""}</div><div class="cov-grid">${boxes}</div>
      ${un.spend?`<div class="note">${money(un.spend)} of spend is on ads not tagged for this theme yet.</div>`:""}</div>`; };
  const main=THEMES.filter(t=>t.type!=="manual"), vid=f.filter(isVideoRow);
  const manHtml=THEMES.filter(t=>t.type==="manual"&&vid.some(r=>(r[t.dim]||"").toString().trim())).map(t=>themeHtml(t,vid)).join("");
  const totDeals=dealsForRows(f);
  document.getElementById("tab-breakdowns").innerHTML=bdBar()+
    `<div class="note" style="margin:-6px 0 14px;">Account ${SCORE_NAME} for these dates: <b>${scoreTxt(tot)}</b> on ${money(tot.spend)}. ${SCORE_RULE}${totDeals.deals?` Green line in a box = ${dealsCrmName()} deals created in these dates whose contact first clicked an ad in that group. All Meta ads: <b>${dealsLine(totDeals)}</b>.`:""}</div>
     ${main.length?`<div class="card">${main.map(t=>themeHtml(t,f)).join("")}</div>`:`<div class="card"><div class="note">No creative themes are set up for this client yet.</div></div>`}
     ${manHtml?`<div class="card"><div class="cov-group">Video details</div>${manHtml}</div>`:""}`;
  wireBdBar();
}
function renderCombo(f){
  const tot=agg(f), key=(r,d)=>(r[d]||"").toString().trim()||"(none)", cell={}, rowT={}, colT={};
  f.forEach(r=>{ const a=key(r,bdA), b=key(r,bdB); if(a==="(none)"||b==="(none)") return;
    (cell[a+"|"+b]=cell[a+"|"+b]||[]).push(r); (rowT[a]=rowT[a]||[]).push(r); (colT[b]=colT[b]||[]).push(r); });
  const bySpend=o=>Object.keys(o).sort((x,y)=>agg(o[y]).spend-agg(o[x]).spend);
  const rowsK=bySpend(rowT), colsK=bySpend(colT).slice(0,8);
  const td=(x,rs)=>{ if(!x.spend) return `<td class="gap">not tested</td>`;
     if(x.spend<bdMin) return `<td class="low"><span class="s">${money(x.spend)}<br>too little</span></td>`;
     const dl=dealsLine(dealsForRows(rs||[]));
     return `<td><span class="v ${scoreCls(x,tot)}">${scoreTxt(x)}</span><span class="s">${money(x.spend)} · ${num(x.leads)} ${RESULT_LABEL.toLowerCase()}${dl?"<br>"+dl:""}</span></td>`; };
  const head=`<tr><th>${bdA} ↓ &nbsp; ${bdB} →</th>${colsK.map(c=>`<th>${c}</th>`).join("")}<th>All</th></tr>`;
  const body=rowsK.map(a=>`<tr><td>${a}</td>${colsK.map(b=>td(agg(cell[a+"|"+b]||[]),cell[a+"|"+b])).join("")}${td(agg(rowT[a]),rowT[a])}</tr>`).join("")+
    `<tr><td>All</td>${colsK.map(b=>td(agg(colT[b]),colT[b])).join("")}${td(tot,f)}</tr>`;
  const pairs=Object.entries(cell).map(([k,rs])=>({k:k.replace("|"," + "),...agg(rs)})).filter(x=>x.spend>=bdMin).sort(rankBest);
  const under=Object.keys(cell).length-pairs.length;
  document.getElementById("tab-breakdowns").innerHTML=bdBar(detailPickers())+
    `<div class="card"><h2>${bdA} and ${bdB} together</h2>
       <div class="note" style="margin:-8px 0 12px;">Each cell is ${SCORE_NAME} for ads that are both. Account: <b>${scoreTxt(tot)}</b>.</div>
       <div style="overflow-x:auto"><table class="mx"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>
     <div class="card"><h2>Pairs ranked by ${SCORE_NAME}</h2>
       <div style="overflow-x:auto"><table><thead><tr><th>${bdA} + ${bdB}</th><th class="num">Spend</th>${resHeadHtml()}</tr></thead><tbody>${
         pairs.map(x=>`<tr><td>${x.k}</td><td class="num">${money(x.spend)}</td>${resCellsHtml(x)}</tr>`).join("")||`<tr><td colspan="6" class="note">No pair has reached the minimum spend in these dates.</td></tr>`}</tbody></table></div>
       ${under?`<div class="note">${under} more pair${under===1?"":"s"} ran under the ${money(bdMin)} minimum and are left out of the ranking.</div>`:""}</div>`;
  wireDetailPickers(); wireBdBar();
}

let crSort={col:null,asc:true};
function renderCreative(f){
  // aggregate filtered daily rows per ad
  const byAd={};
  f.forEach(r=>{ const id=r["Ad ID"]; const a=byAd[id]||(byAd[id]={id,name:r["Ad Name"],format:r["Format"],funnel:r["Funnel"],
    spend:0,leads:0,rev:0,tags:r}); a.spend+=r._spend; a.leads+=r._leads; a.rev+=r._rev; });
  let ads=Object.values(byAd).map(a=>({...a, cpa:a.leads?a.spend/a.leads:0, roas:a.spend&&a.rev?a.rev/a.spend:0, aov:a.leads?a.rev/a.leads:0}));
  const smart=(a,b)=>IS_ROAS?((a.rev&&b.rev)?b.roas-a.roas:b.spend-a.spend):((a.leads&&b.leads)?a.cpa-b.cpa:(a.leads?-1:b.leads?1:b.spend-a.spend));
  const sval=(a,c)=>{ if(c==="spend")return a.spend; if(c==="leads")return a.leads; if(c==="rev")return a.rev;
    if(c==="cpa")return a.cpa; if(c==="roas")return a.roas; if(c==="aov")return a.aov; if(c==="name")return (a.name||"").toLowerCase();
    if(c==="format")return (a.format||"").toLowerCase(); if(c==="funnel")return (a.funnel||"").toLowerCase();
    return (a.tags[c]||"").toString().toLowerCase(); };
  ads.sort(crSort.col?((a,b)=>{const va=sval(a,crSort.col),vb=sval(b,crSort.col),s=crSort.asc?1:-1;return va<vb?-s:va>vb?s:0;}):smart);
  const arr=c=>crSort.col===c?(crSort.asc?" ▲":" ▼"):"";
  const sth=(c,l,cls)=>`<th class="${cls||""}" data-sort="${c}">${l}${arr(c)}</th>`;
  const aiCols=AI_DIMS;
  const resultHead=IS_ROAS?sth("rev","Revenue","num")+sth("roas","ROAS","num")+sth("cpa","CPA","num")+sth("aov","AOV","num"):sth("leads",RESULT_LABEL,"num")+sth("cpa","CPA","num");
  const head=`<tr>${sth("name","Ad")}${sth("format","Format")}${sth("funnel","Funnel")}`+
    aiCols.map(d=>sth(d,d,"ai")).join("")+sth("spend","Spend","num")+resultHead+`</tr>`;
  const rows=ads.map(a=>{
    const resultCells=IS_ROAS
      ? `<td class="num">${money(a.rev)}</td><td class="num ${a.rev?(a.roas>=1?"good":"bad"):""}">${a.rev?a.roas.toFixed(2)+"x":"—"}</td><td class="num">${a.leads?money(a.cpa):"—"}</td><td class="num">${a.leads?money(a.aov):"—"}</td>`
      : `<td class="num">${num(a.leads)||"—"}</td><td class="num">${a.leads?money(a.cpa):"—"}</td>`;
    return `<tr><td class="adname">${a.name||""}</td><td><span class="pill">${a.format||"—"}</span></td><td>${a.funnel||"—"}</td>`+
      aiCols.map(d=>`<td class="ai edit" data-adid="${a.id}" data-field="${d}">${d===aiCols[0]?'<span class="ai-pill">'+(a.tags[d]||"—")+'</span>':(a.tags[d]||"—")}</td>`).join("")+
      `<td class="num">${money(a.spend)}</td>${resultCells}</tr>`;
  }).join("");
  document.getElementById("tab-creative").innerHTML=kpiHtml(f)+
    `<div class="card"><h2>Ads — ranked by ${IS_ROAS?"ROAS":"cost per "+RESULT_ONE}
       <span class="aimark">✨ creative tagged by Claude</span></h2>
       <div class="warn-bar">✎ Click any AI tag to edit it. Your change overrides the AI and saves to the tagging sheet${WEBHOOK_URL?"":" (saving not configured for this client yet)"}.</div>
       <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>`;
  document.querySelectorAll("#tab-creative th[data-sort]").forEach(th=>th.addEventListener("click",()=>{
    const c=th.dataset.sort;
    if(crSort.col===c)crSort.asc=!crSort.asc; else {crSort.col=c; crSort.asc=(c==="name"||c==="format"||c==="funnel"||c==="cpa"||AI_DIMS.includes(c));}
    renderCreative(filtered());
  }));
  wireCreativeEdit();
}

/* ── Inline tag editing (Creative tab), saved back via the client webhook ── */
let _warned=false;
function wireCreativeEdit(){
  const el=document.getElementById("tab-creative");
  if(!el || el._wired) return; el._wired=true;   // delegate once; survives re-renders
  el.addEventListener("click", e=>{
    const cell=e.target.closest("td.edit");
    if(!cell || cell.querySelector(".cell-edit")) return;
    if(_warned){ beginEdit(cell); return; }
    const m=document.getElementById("editWarn"); m.classList.add("show");
    document.getElementById("warnOk").onclick=()=>{ if(document.getElementById("dontWarn").checked)_warned=true; m.classList.remove("show"); beginEdit(cell); };
    document.getElementById("warnCancel").onclick=()=>m.classList.remove("show");
  });
}
function beginEdit(cell){
  const field=cell.dataset.field, cur=cell.textContent.trim(), opts=EDIT_OPTIONS[field];
  let inp;
  if(opts){ inp=document.createElement("select"); inp.className="cell-edit";
    opts.forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;if(o===cur)op.selected=true;inp.appendChild(op);}); }
  else { inp=document.createElement("input"); inp.className="cell-edit"; inp.value=(cur==="—"?"":cur); inp.size=24; }
  cell.innerHTML=""; cell.appendChild(inp); inp.focus();
  const commit=()=>commitEdit(cell,field,inp.value);
  inp.addEventListener("blur",commit,{once:true});
  inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault();inp.blur();} if(ev.key==="Escape"){inp.removeEventListener("blur",commit); cell.textContent=cur;} });
  if(opts) inp.addEventListener("change",()=>inp.blur());
}
function commitEdit(cell,field,value){
  const adid=cell.dataset.adid; value=(value||"").trim();
  if(field===AI_DIMS[0]) cell.innerHTML='<span class="ai-pill">'+(value||"—")+'</span>'; else cell.textContent=value||"—";
  ROWS.forEach(r=>{ if(String(r["Ad ID"])===String(adid)) r[field]=value; });   // so breakdowns recompute
  cell.classList.remove("saved"); cell.classList.add("unsaved");
  if(!WEBHOOK_URL) return;
  fetch(WEBHOOK_URL,{method:"POST",mode:"no-cors",body:new URLSearchParams({ad_id:adid,field:field,value:value})})
    .then(()=>{cell.classList.remove("unsaved");cell.classList.add("saved");}).catch(()=>{});
}
</script>

<div class="modal-bg" id="editWarn">
  <div class="modal">
    <h3>You're editing an AI tag</h3>
    <p>This replaces the tag Claude generated and saves it to your tagging sheet. The AI won't change it back unless you run a full re-tag.</p>
    <label><input type="checkbox" id="dontWarn"> Don't warn me again this session</label>
    <div class="row"><button id="warnCancel">Cancel</button><button class="primary" id="warnOk">Got it, edit</button></div>
  </div>
</div>
</body>
