<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --primary:#209D50; --primary-dark:#1a8a44;
  --bg:#E1DFD9; --card:#fff; --border:#C8C5BE; --header-bg:#F5F4F1;
  --text:#1a1a1a; --muted:#666; --good:#209D50; --bad:#E53935;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5; padding:24px;}
.wrap{max-width:1200px; margin:0 auto;}
.head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .dot{width:30px; height:30px; border-radius:7px; background:var(--primary);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px;}
.brand .name{font-size:15px; font-weight:700; letter-spacing:2px; color:var(--primary);}
.title{font-size:22px; font-weight:700;}
.sub{font-size:13px; color:var(--muted); margin-bottom:16px;}

/* Controls */
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card);
  border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:16px;}
.controls label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px;}
.controls input[type=date],.controls select{font:inherit; font-size:13px; padding:4px 7px;
  border:1px solid var(--border); border-radius:7px; background:#fff;}
.preset{font-size:12.5px; padding:5px 11px; border-radius:20px; border:1px solid var(--border);
  background:#fff; cursor:pointer;}
.preset.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.spacer{flex:1;}
/* creative themes: coverage grid + combinations */
.seg{display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-right:12px;}
.seg button{font:inherit; font-size:13px; font-weight:600; padding:6px 14px; border:0; background:#fff; color:var(--muted); cursor:pointer;}
.seg button.on{background:var(--primary); color:#fff;}
.bd-bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; font-size:13px; color:var(--muted);}
.bd-bar select,.bd-bar input{font:inherit; font-size:13px; padding:4px 7px; border:1px solid var(--border); border-radius:7px; background:#fff;}
.cov-group{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin:6px 0 10px;}
.cov-theme{margin-bottom:20px;}
.cov-theme h3{font-size:15px; font-weight:700;}
.cov-theme .q{font-size:12px; color:var(--muted); margin-bottom:8px;}
.cov-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px;}
.cov-box{background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
.cov-box.low{background:var(--header-bg); border-style:dashed;}
.cov-box.gap{background:#FFF7E6; border-color:#F0C36D;}
.cov-box .l{font-size:13px; font-weight:600;}
.cov-box .t{height:4px; border-radius:2px; background:var(--header-bg); margin-top:7px; overflow:hidden;}
.cov-box .t i{display:block; height:100%; background:var(--primary);}
.cov-box .r{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; font-size:12px; color:var(--muted);}
.cov-box .v{font-size:16px; font-weight:700; color:var(--text);}
.cov-box .n{font-size:11.5px; color:var(--muted); margin-top:6px;}
.cov-box .v.good, table.mx td .v.good{color:var(--good);} .cov-box .v.bad, table.mx td .v.bad{color:var(--bad);}
table.mx th, table.mx td{text-align:center; white-space:normal; min-width:96px; vertical-align:middle;}
table.mx th:first-child, table.mx td:first-child{text-align:left; font-weight:600; min-width:150px;}
table.mx td .v{font-size:15px; font-weight:700; display:block;}
table.mx td .s{font-size:11px; color:var(--muted);}
table.mx td.low{background:var(--header-bg); color:var(--muted);}
table.mx td.gap{background:#FFFBF0; color:#C9A24D;}
.needs-bar{background:#EAF3F5; border:1px solid var(--border); color:var(--text); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
.needs-bar button{font:inherit; font-size:12.5px; padding:4px 10px; border-radius:7px; border:1px solid var(--primary); background:#fff; color:var(--primary); cursor:pointer;}
td.na{color:var(--muted); font-size:12px;}
/* Optional login gate (registry `password`) */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 48px);}
.login-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:48px 40px;width:400px;max-width:90vw;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.login-brand{font-size:20px;font-weight:700;letter-spacing:2.5px;color:var(--primary);margin-bottom:8px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:32px;}
.login-client{font-size:17px;font-weight:600;margin-bottom:28px;color:var(--text);}
.login-input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none;}
.login-input:focus{border-color:var(--primary);}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;}
.login-btn:hover{background:var(--primary-dark);}
.login-err{color:var(--bad);font-size:13px;margin-top:12px;min-height:20px;}

/* Tabs */
.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:16px;}
.tab-btn{font-size:13px; padding:8px 16px; border-radius:9px 9px 0 0; border:1px solid transparent;
  background:transparent; cursor:pointer; color:var(--muted); font-weight:600;}
.tab-btn.active{background:var(--card); color:var(--text); border-color:var(--border); border-bottom-color:var(--card);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* KPIs */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px;}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
.kpi .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
.kpi .val{font-size:26px; font-weight:700; margin-top:4px;}
.kpi-delta{font-size:11px; font-weight:600; margin-top:3px;}
.kpi-delta.good{color:var(--good);}
.kpi-delta.bad{color:var(--bad);}
.kpi-delta.neutral{color:var(--muted);}

/* Cards + charts */
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:18px;}
.card h2{font-size:16px; font-weight:700; margin-bottom:14px;}
.chart-wrap{position:relative; height:300px;}
.chart-row{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:760px){.chart-row{grid-template-columns:1fr;}}

/* Table */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); cursor:pointer; user-select:none;}
.tbl-delta{display:block; font-size:10.5px; font-weight:600; margin-top:1px;}
.tbl-delta.good{color:var(--good);}
.tbl-delta.bad{color:var(--bad);}
.tbl-delta.neutral{color:var(--muted);}
/* Pipeline & Revenue tab (optional, registry `deals`) */
.deals-tbl th{cursor:default;}
.deals-tbl td.dbar{position:relative;}
.deals-tbl .dbar-fill{position:absolute;left:4px;top:5px;bottom:5px;background:#e3efe7;border-radius:2px;}
.deals-tbl .dbar-txt{position:relative;}
.deals-sel{font:inherit;font-size:13px;font-weight:400;padding:3px 7px;border:1px solid var(--border);border-radius:7px;background:#fff;}
th.num,td.num{text-align:right;}
tbody tr:hover{background:var(--header-bg);}
.thumb{width:42px; height:42px; border-radius:6px; object-fit:cover; background:var(--header-bg); display:block;}
.adname{white-space:normal; min-width:200px; font-weight:600;}
.pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--header-bg); color:var(--muted);}
.ai-pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
  background:rgba(32,157,80,.12); color:var(--primary-dark); font-weight:600;}
th.ai,td.ai{background:rgba(32,157,80,.05);}
.aimark{font-size:10px; font-weight:700; color:var(--primary); background:rgba(32,157,80,.12);
  padding:1px 7px; border-radius:20px; margin-left:6px; vertical-align:middle;}
.good{color:var(--good); font-weight:700;} .bad{color:var(--bad); font-weight:700;}
.loading,.err{text-align:center; padding:60px 20px; color:var(--muted);}
.err{color:var(--bad);}
.note{font-size:12px; color:var(--muted); margin-top:4px;}
/* editable tags */
td.edit{cursor:text;}
td.edit:hover{outline:1px dashed var(--primary); outline-offset:-2px;}
td.edit:hover::after{content:"✎"; font-size:10px; color:var(--primary); opacity:.6; margin-left:5px;}
td.saved{background:rgba(32,157,80,.14);} td.unsaved{background:rgba(255,193,7,.22);}
select.cell-edit,input.cell-edit{font:inherit; padding:2px 4px; border:1px solid var(--primary); border-radius:5px; max-width:190px;}
.warn-bar{background:#FFF7E6; border:1px solid #F0C36D; color:#7a5b00; font-size:12.5px; padding:8px 12px; border-radius:8px; margin-bottom:14px;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:50;}
.modal-bg.show{display:flex;}
.modal{background:#fff; border-radius:12px; padding:24px; max-width:390px; box-shadow:0 8px 40px rgba(0,0,0,.2);}
.modal h3{margin-bottom:10px; font-size:16px;} .modal p{font-size:13.5px; color:var(--muted); margin-bottom:16px;}
.modal label{font-size:12px; display:block; margin-bottom:16px;}
.modal .row{display:flex; gap:10px; justify-content:flex-end;}
.modal button{padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px;}
.modal button.primary{background:var(--primary); color:#fff; border-color:var(--primary);}
</style>
</head>
<body>
<div id="loginWrap" class="login-wrap" style="display:none;">
  <div class="login-card">
    <div class="login-brand" id="loginBrand">CASSA STRATEGY</div>
    <div class="login-sub">Ads Dashboard</div>
    <div class="login-client" id="loginClient">Ad Performance</div>
    <input type="password" id="loginPw" class="login-input" placeholder="Enter password">
    <button id="loginBtn" class="login-btn">Sign In</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>
<div class="wrap" id="app">
  <div class="head">
    <div class="brand"><div class="dot" id="brandDot">C</div><div class="name" id="brandName">CASSA STRATEGY</div></div>
    <div class="sub" id="range" style="margin:0;"></div>
  </div>
  <div class="title" id="clientTitle">Ad Performance</div>
  <div class="sub" id="clientSub">Keyed on ad ID, so renames never break it.</div>

  <div id="content"><div class="loading">Loading live data…</div></div>
</div>

<script src="ads-clients.js"></script>
<script>
/* ============================================================
   Flexible multi-client ad dashboard. Reads the daily ad-level
   tab + the AI tags from one product sheet (per ?client=),
   joins tags onto daily rows by Ad ID, and date-filters.
   ============================================================ */
const PARAMS = new URLSearchParams(location.search);
const CLIENTS = window.AD_CLIENTS || {};
const CLIENT_KEY = PARAMS.get("client") || Object.keys(CLIENTS)[0];
const CFG = CLIENTS[CLIENT_KEY];

if(!CFG){
  document.getElementById("content").innerHTML =
    `<div class="err">Unknown client "<b>${CLIENT_KEY||""}</b>".<br><span class="note">`+
    `Known: ${Object.keys(CLIENTS).join(", ")||"none"}. Pass one as <code>?client=&lt;key&gt;</code>.</span></div>`;
  throw new Error("unknown client");
}

const BRAND=CFG.brand, SHEET_ID=CFG.sheetId;
const DAILY_TAB=CFG.dailyTab||"Ad Daily", TAG_TAB=CFG.tagTab||"Tagging", PERF_TAB=CFG.tab||"Ad Performance";
const IS_ROAS=CFG.resultMetric==="roas";
let AI_DIMS=CFG.aiDims||[];
let EDIT_OPTIONS=CFG.editOptions||{};   // controlled-dim dropdown values; others edit as text
const WEBHOOK_URL=CFG.webhookUrl||"";     // Apps Script /exec to save tag edits back
const MODELED=CFG.modeled||null;          // CRM truth layer config (optional)
const SPARKLOOP=CFG.sparkloop||null;      // SparkLoop Earn tabs config (optional)
const DEALS=CFG.deals||null;              // CRM pipeline + revenue config (optional)
const DERIVED_DIMS=["Format","Audience","Funnel","Objective"];
let BREAKDOWN_DIMS=DERIVED_DIMS.concat(AI_DIMS);
// Creative themes v2: the live theme list (names, allowed values, who fills them) comes from the
// sheet's Taxonomy tab; the registry's aiDims/editOptions are only the fallback.
let THEMES=[];   // [{dim, type: select|auto|manual, values[], hint}]
const NEUTRAL=new Set(["None","No one","Varies","Not a video","No","No product shown"]);
const THEME_Q={"Selling angle":"The main reason the creative gives someone to act","Look":"How the creative was made",
  "What's shown":"Who or what is in the frame","Text on the creative":"Strongest text element on the image or video",
  "AI-made":"Whether the image or video is AI-generated","Who's talking":"Whose voice carries the message",
  "Shape":"From the file's pixel size","Video length":"From the video file",
  "Brand in first 3 sec":"Videos only","Works with sound off":"Videos only","Audio":"Videos only"};
const isVideoRow=r=>{ const v=(r["Video length"]||"").toString(); return v && v!=="Not a video"; };   // special dims appended after load when their tabs have data
const RESULT_LABEL=CFG.resultLabel || (IS_ROAS?"Revenue":"Leads");
const RESULT_ONE=RESULT_LABEL.replace(/s$/,"").toLowerCase();   // "lead" / "purchase"

document.getElementById("brandName").textContent=BRAND.name;
document.getElementById("brandDot").textContent=BRAND.initial;
document.getElementById("brandDot").style.background=BRAND.color;
document.getElementById("clientTitle").textContent=CFG.title||"Ad Performance";
if(CFG.subtitle) document.getElementById("clientSub").textContent=CFG.subtitle;
document.documentElement.style.setProperty("--primary",BRAND.color);
document.title=CFG.title||"Ad Performance";

const COLORS=["#209D50","#4A90D9","#FF6B6B","#FFA500","#9D50D9","#50C8D9","#D4A843","#E8527A","#7BC67E","#6B8DE3"];
const money=v=>"$"+(+v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Math.round(+v||0).toLocaleString();
const pv=v=>{ if(v==null||v==="") return 0; if(typeof v==="number") return v; return parseFloat(String(v).replace(/[$,%]/g,""))||0; };

// gviz with headers=1 (pins header to row 1 so upsert-frozen string rows aren't dropped).
function gvizUrlFor(sheetId,tab){ return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tab)}&t=${Date.now()}`; }
function gvizUrl(tab){ return gvizUrlFor(SHEET_ID,tab); }
function parseGviz(text){
  const j=JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}")+1));
  const cols=(j.table.cols||[]).map(c=>c.label||"");
  const rows=(j.table.rows||[]).map(r=>{ const o={}; (r.c||[]).forEach((c,i)=>{
    let v=c?c.v:null;
    if(typeof v==="string" && v.indexOf("Date(")===0){ const p=v.slice(5,-1).split(","); v=p[0]+"-"+String(+p[1]+1).padStart(2,"0")+"-"+String(+p[2]).padStart(2,"0"); }
    o[cols[i]]=v; }); return o; });
  return {cols, rows};
}

let ROWS=[], DMIN="", DMAX="", state={from:"",to:"",tab:"overview",campaign:"",adset:"",cmp:true}, charts={};
// Optional breakdown tabs (Device Detail / Demographics / Hourly / PMax Channels).
// Rows carry the dim value under the dim's display name so aggByDim works as-is.
let BRK={device:[],demo:[],hourly:[],pmax:[]};
let MOD={rows:[],ga4:[]};   // CRM truth layer (monthly) + GA4 traffic, when configured
let SL={payouts:[],partners:[]};   // SparkLoop Earn data, when configured
let dealsData=[];          // CRM deal snapshot: one row per deal, when `deals` is configured
let dealChangesData=[];    // CRM deal change log (append-only), when `deals` is configured
function parseBrkTab(text, build){
  if(!text) return [];
  try{
    return parseGviz(text).rows.map(build).filter(r=>r && r._date && r._spend>0);
  }catch(e){ return []; }
}
let BUDGETS={};   // {'YYYY-MM': monthly budget} from the sheet's Budgets tab (optional)

// Most recent Budgets-tab month at or before ym applies (one row carries forward).
function monthlyBudgetFor(ym){
  if(BUDGETS[ym]) return BUDGETS[ym];
  let best=0;
  Object.keys(BUDGETS).sort().forEach(m=>{ if(m<=ym) best=BUDGETS[m]; });
  return best;
}

/* Optional password gate: set `password` on the client's registry entry. */
const PASSWORD=CFG.password||"";
function doLogin(){
  const pw=document.getElementById("loginPw").value;
  if(pw===PASSWORD){ document.getElementById("loginWrap").style.display="none"; document.getElementById("app").style.display="block"; loadData(); }
  else { document.getElementById("loginErr").textContent="Incorrect password. Please try again."; document.getElementById("loginPw").value=""; document.getElementById("loginPw").focus(); }
}
if(PASSWORD){
  document.getElementById("app").style.display="none";
  document.getElementById("loginWrap").style.display="flex";
  document.getElementById("loginBrand").textContent=BRAND.name;
  document.getElementById("loginClient").textContent=CFG.title||"Ad Performance";
  document.getElementById("loginBtn").addEventListener("click",doLogin);
  document.getElementById("loginPw").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  document.getElementById("loginPw").focus();
} else { loadData(); }

function loadData(){
Promise.all([fetch(gvizUrl(DAILY_TAB)).then(r=>r.text()),
             fetch(gvizUrl(TAG_TAB)).then(r=>r.text()),
             fetch(gvizUrl(PERF_TAB)).then(r=>r.text()).catch(()=>""),
             fetch(gvizUrl("Budgets")).then(r=>r.text()).catch(()=>""),
             fetch(gvizUrl("Device Detail")).then(r=>r.text()).catch(()=>""),
             fetch(gvizUrl("Demographics")).then(r=>r.text()).catch(()=>""),
             fetch(gvizUrl("Hourly")).then(r=>r.text()).catch(()=>""),
             fetch(gvizUrl("PMax Channels")).then(r=>r.text()).catch(()=>""),
             MODELED?fetch(gvizUrlFor(MODELED.sheetId||SHEET_ID,MODELED.tab||"Modeled Metrics")).then(r=>r.text()).catch(()=>""):Promise.resolve(""),
             MODELED&&MODELED.ga4Tab?fetch(gvizUrlFor(MODELED.sheetId||SHEET_ID,MODELED.ga4Tab)).then(r=>r.text()).catch(()=>""):Promise.resolve(""),
             SPARKLOOP?fetch(gvizUrlFor(SPARKLOOP.sheetId||SHEET_ID,SPARKLOOP.payoutsTab||"SparkLoop Payouts")).then(r=>r.text()).catch(()=>""):Promise.resolve(""),
             SPARKLOOP?fetch(gvizUrlFor(SPARKLOOP.sheetId||SHEET_ID,SPARKLOOP.partnersTab||"SparkLoop Partners")).then(r=>r.text()).catch(()=>""):Promise.resolve(""),
             DEALS?fetch(gvizUrlFor(DEALS.sheetId||SHEET_ID,DEALS.dealsTab||"HS Deals")).then(r=>r.text()).catch(()=>""):Promise.resolve(""),
             DEALS?fetch(gvizUrlFor(DEALS.sheetId||SHEET_ID,DEALS.changesTab||"HS Deal Changes")).then(r=>r.text()).catch(()=>""):Promise.resolve(""),
             fetch(gvizUrl("Taxonomy")).then(r=>r.text()).catch(()=>"")])
 .then(([dailyT, tagT, perfT, budgetT, deviceT, demoT, hourlyT, pmaxT, modeledT, ga4T, slPayT, slParT, dealsT, dealChgT, taxT])=>{
   try{ THEMES=parseGviz(taxT).rows.map(r=>({dim:String(r["Dimension"]||"").trim(), type:String(r["Type"]||"select").trim().toLowerCase(),
       values:String(r["Values"]||"").split(",").map(v=>v.trim()).filter(Boolean), hint:String(r["Hint"]||"")}))
     .filter(t=>t.dim && ["select","auto","manual"].includes(t.type)); }catch(e){ THEMES=[]; }
   if(!THEMES.length) THEMES=AI_DIMS.map(d=>({dim:d,type:"select",values:EDIT_OPTIONS[d]||[],hint:""}));
   AI_DIMS=THEMES.map(t=>t.dim);
   EDIT_OPTIONS={}; THEMES.forEach(t=>{ if(t.type!=="auto" && t.values.length) EDIT_OPTIONS[t.dim]=t.values; });
   BREAKDOWN_DIMS=DERIVED_DIMS.concat(AI_DIMS); bdDim=AI_DIMS[0]||BREAKDOWN_DIMS[0];
   // CRM deal snapshot + change log (optional; Pipeline & Revenue tab)
   dealsData=[]; dealChangesData=[];
   try{ parseGviz(dealsT).rows.forEach(dl=>{ if(!dl["Deal ID"]) return;
     dealsData.push({ id:String(dl["Deal ID"]).replace(/\.0$/,""), created:dl["Created"]||"", createdMonth:dl["Created Month"]||"",
       closeDate:dl["Close Date"]||"", line:dl["Service Line"]||"", pipeline:dl["Pipeline"]||"", stage:dl["Stage"]||"",
       cstage:dl["Canonical Stage"]||"", outcome:dl["Outcome"]||"", source:dl["Source"]||"", bucket:dl["Source Bucket"]||"",
       campaign:dl["Campaign"]||"", latestBucket:dl["Latest Bucket"]||"", latestCampaign:dl["Latest Campaign"]||"",
       keyword:dl["Keyword"]||"", latestKeyword:dl["Latest Keyword"]||"", ad:dl["Ad"]||"",
       value:pv(dl["Deal Value"]), leadMagnet:dl["Lead Magnet"]==="Y", owner:dl["Owner"]||"",
       leadCallDate:dl["Lead Call Date"]||"", proposalDate:dl["Proposal Date"]||"", wonDate:dl["Won Date"]||"",
       completeDate:dl["Complete Date"]||"", asOf:dl["As Of"]||"", dataSource:dl["Data Source"]||"" }); }); }catch(e){}
   try{ parseGviz(dealChgT).rows.forEach(dc=>{ if(!dc["Deal ID"]||!dc["Observed"]) return;
     dealChangesData.push({ observed:dc["Observed"], id:String(dc["Deal ID"]).replace(/\.0$/,""), line:dc["Service Line"]||"",
       bucket:dc["Source Bucket"]||"", campaign:dc["Campaign"]||"", field:dc["Field"]||"", from:dc["From"]||"",
       to:dc["To"]||"", exactness:dc["Exactness"]||"", value:pv(dc["Deal Value"]), outcome:dc["Outcome"]||"" }); }); }catch(e){}
   // SparkLoop Earn tabs (optional; written by the client's sparkloop pull script).
   // Rows with no date (one legacy payout) are kept for totals, skipped in charts.
   SL={payouts:[],partners:[]};
   try{ parseGviz(slPayT).rows.forEach(r=>{ const d=String(r["Date"]||"").slice(0,10), a=pv(r["Amount (USD)"]);
     if(a>0) SL.payouts.push({date:d, amount:a, status:String(r["Status"]||"").trim()}); }); }catch(e){}
   try{ parseGviz(slParT).rows.forEach(r=>{ const n=String(r["Partner Program"]||"").trim();
     if(n) SL.partners.push({name:n, status:String(r["Status"]||"").trim(), cpa:pv(r["CPA (USD)"]), maxPayout:pv(r["Max Payout (USD)"])}); }); }catch(e){}
   SL.payouts.sort((a,b)=>a.date<b.date?-1:1);
   // CRM truth layer (optional tab)
   MOD.rows=[]; MOD.ga4=[];
   try{ parseGviz(modeledT).rows.forEach(r=>{ if(!r["Month"]||!r["Source"]) return;
     MOD.rows.push({month:String(r["Month"]).slice(0,7), source:String(r["Source"]),
       bookings:pv(r["HS Bookings"]!==undefined?r["HS Bookings"]:r["CRM Conversions"]), cancels:pv(r["HS Cancels"]),
       spend:pv(r["Spend"]), claimed:pv(r["Platform Claimed"])}); }); }catch(e){}
   try{ parseGviz(ga4T).rows.forEach(r=>{ if(!r["Month"]||!r["Channel"]) return;
     MOD.ga4.push({month:String(r["Month"]).slice(0,7), channel:String(r["Channel"]),
       sessions:pv(r["Sessions"]), users:pv(r["Users"]), keyEvents:pv(r["Key Events"])}); }); }catch(e){}
   try{ parseGviz(budgetT).rows.forEach(r=>{
     const m=String(r["Month"]||"").slice(0,7);
     const b=parseFloat(String(r["Budget"]||"").replace(/[$,]/g,""));
     if(/^\d{4}-\d{2}$/.test(m) && b>0) BUDGETS[m]=b; }); }catch(e){}
   const daily=parseGviz(dailyT).rows.filter(r=>r["Ad ID"] && r["Date"]);
   const tagsParsed=parseGviz(tagT);
   const tagCols=tagsParsed.cols.filter(c=>c!=="Ad ID"&&c!=="Ad Name");
   const tags={};
   tagsParsed.rows.forEach(r=>{ const id=String(r["Ad ID"]||"").trim(); if(!id) return;
     const o={}; tagCols.forEach(c=>o[c]=r[c]||""); tags[id]=o; });
   // ad copy (headline + primary text) by Ad ID, from the perf tab
   const copy={};
   try{ parseGviz(perfT).rows.forEach(r=>{ const id=String(r["Ad ID"]||"").trim();
     if(id) copy[id]={headline:r["Headline"]||"", body:r["Primary Text"]||""}; }); }catch(e){}
   // join tags + copy onto daily rows by Ad ID + coerce numerics
   ROWS=daily.map(r=>{
     const id=String(r["Ad ID"]).trim();
     const o=Object.assign({}, r, tags[id]||{});
     const c=copy[id]||{}; o._headline=c.headline||""; o._body=c.body||"";
     o._date=String(o["Date"]).slice(0,10);
     o._spend=pv(o["Spend"]); o._imp=pv(o["Impressions"]); o._clicks=pv(o["Clicks"]);
     o._leads=pv(o["Leads"]); o._rev=pv(o["Revenue"]);
     return o;
   });
   const ds=ROWS.map(r=>r._date).filter(Boolean).sort();
   DMIN=ds[0]||""; DMAX=ds[ds.length-1]||"";
   state.from=DMIN; state.to=DMAX;

   // Optional breakdown tabs → special dims (only offered when data exists)
   const brkBase=r=>({_date:String(r["Date"]||"").slice(0,10), "Ad ID":"",
     _spend:pv(r["Spend"]), _imp:pv(r["Impressions"]), _clicks:pv(r["Clicks"]),
     _leads:pv(r["Results"]), _rev:pv(r["Revenue"])});
   BRK.device=parseBrkTab(deviceT, r=>Object.assign(brkBase(r), {"Device":String(r["Device"]||"").trim(), Campaign:String(r["Campaign"]||"")}));
   BRK.demo=parseBrkTab(demoT, r=>Object.assign(brkBase(r), {"Age":String(r["Age"]||"").trim(), "Gender":String(r["Gender"]||"").trim(), Campaign:String(r["Campaign"]||"")}));
   BRK.hourly=parseBrkTab(hourlyT, r=>{ const h=parseInt(r["Hour"],10);
     return Object.assign(brkBase(r), {"Hour of Day": isNaN(h)?"":( (h<10?"0"+h:""+h)+":00")}); });
   BRK.pmax=parseBrkTab(pmaxT, r=>Object.assign(brkBase(r), {"PMax Channel":String(r["Channel"]||"").trim(), Campaign:String(r["Campaign"]||""),
     _leads:pv(r["Leads"]!==undefined?r["Leads"]:r["Results"])}));
   if(BRK.device.length) BREAKDOWN_DIMS.push("Device");
   if(BRK.demo.length) BREAKDOWN_DIMS.push("Age","Gender");
   if(BRK.hourly.length) BREAKDOWN_DIMS.push("Hour of Day");
   if(BRK.pmax.length) BREAKDOWN_DIMS.push("PMax Channel");

   buildShell(); render();
 })
 .catch(e=>{ document.getElementById("content").innerHTML=
   `<div class="err">Couldn't load the data.<br><span class="note">If the sheet isn't shared link-readable, the dashboard can't read it. (${e})</span></div>`; });
}

/* ── Aggregation helpers ─────────────────────────────────────────── */
function scoped(){ return ROWS.filter(r=>(!state.campaign||r["Campaign"]===state.campaign)&&(!state.adset||r["Ad Set"]===state.adset)); }
function filtered(){ return scoped().filter(r=>r._date>=state.from && r._date<=state.to); }
function agg(rows){ let spend=0,leads=0,rev=0,imp=0,clicks=0;
  rows.forEach(r=>{spend+=r._spend;leads+=r._leads;rev+=r._rev;imp+=r._imp;clicks+=r._clicks;});
  return {spend,leads,rev,imp,clicks,cpa:leads?spend/leads:0,roas:spend&&rev?rev/spend:0,aov:leads?rev/leads:0,ads:new Set(rows.map(r=>r["Ad ID"])).size};
}
function groupBy(rows,key){ const g={}; rows.forEach(r=>{ const k=(r[key]||"").toString().trim()||"(none)"; (g[k]=g[k]||[]).push(r); }); return g; }

/* ── Shell (controls + tabs) ─────────────────────────────────────── */
function buildShell(){
  const presets=["7d","14d","30d","This Mo","Last Mo","All"].map(p=>`<button class="preset" data-preset="${p}">${p}</button>`).join("");
  const bySpendKey=key=>{ const m={}; ROWS.forEach(r=>{ const k=(r[key]||"").toString(); if(k) m[k]=(m[k]||0)+r._spend; }); return Object.keys(m).sort((x,y)=>m[y]-m[x]); };
  const campOpts=`<option value="">All Campaigns</option>`+bySpendKey("Campaign").map(c=>`<option>${c}</option>`).join("");
  document.getElementById("content").innerHTML=`
    <div class="controls">
      <label>From <input type="date" id="cFrom" value="${state.from}" min="${DMIN}" max="${DMAX}"></label>
      <label>To <input type="date" id="cTo" value="${state.to}" min="${DMIN}" max="${DMAX}"></label>
      ${presets}
      <label style="font-size:13px;color:var(--text);cursor:pointer;"><input type="checkbox" id="cCmp"${state.cmp?" checked":""}> vs Previous Period</label>
      <select id="cCamp" style="max-width:230px;">${campOpts}</select>
      <select id="cAdset" style="max-width:230px;"></select>
      <button class="preset" id="cReset" style="border-color:var(--bad);color:var(--bad);">Reset All</button>
      <span class="spacer"></span>
      <span class="note" id="rowNote"></span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="trends">Trends</button>
      <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
      <button class="tab-btn" data-tab="campaigns">Campaigns</button>
      <button class="tab-btn" data-tab="breakdowns">Breakdowns</button>
      <button class="tab-btn" data-tab="byad">By Ad</button>
      <button class="tab-btn" data-tab="headlines">Headlines &amp; Copy</button>
      <button class="tab-btn" data-tab="funnel">Funnel</button>
      ${MOD.rows.length?`<button class="tab-btn" data-tab="modeled">Cost per ${MODELED.noun||"Booking"}</button>`:""}
      ${DEALS?`<button class="tab-btn" data-tab="deals">Pipeline &amp; Revenue</button>`:""}
      ${SL.payouts.length?`<button class="tab-btn" data-tab="sparkloop">SparkLoop</button>`:""}
      <button class="tab-btn" data-tab="pacing">Budget Pacing</button>
      <button class="tab-btn" data-tab="creative">Creative</button>
    </div>
    <div id="tab-overview" class="tab-content active"></div>
    <div id="tab-trends" class="tab-content"></div>
    <div id="tab-leaderboard" class="tab-content"></div>
    <div id="tab-campaigns" class="tab-content"></div>
    <div id="tab-breakdowns" class="tab-content"></div>
    <div id="tab-byad" class="tab-content"></div>
    <div id="tab-headlines" class="tab-content"></div>
    <div id="tab-funnel" class="tab-content"></div>
    ${MOD.rows.length?`<div id="tab-modeled" class="tab-content"></div>`:""}
    ${DEALS?dealsShellHtml():""}
    ${SL.payouts.length?`<div id="tab-sparkloop" class="tab-content"></div>`:""}
    <div id="tab-pacing" class="tab-content"></div>
    <div id="tab-creative" class="tab-content"></div>`;

  fillAdsets();
  document.getElementById("cCmp").addEventListener("change",e=>{state.cmp=e.target.checked; render();});
  document.getElementById("cCamp").addEventListener("change",e=>{state.campaign=e.target.value; state.adset=""; fillAdsets(); render();});
  document.getElementById("cAdset").addEventListener("change",e=>{state.adset=e.target.value; render();});
  document.getElementById("cReset").addEventListener("click",()=>{ state.campaign=""; state.adset=""; state.cmp=true;
    document.getElementById("cCamp").value=""; document.getElementById("cCmp").checked=true; fillAdsets(); applyPreset("All",document.querySelector('.preset[data-preset="All"]')); });
  document.getElementById("cFrom").addEventListener("change",e=>{state.from=e.target.value; clearPreset(); render();});
  document.getElementById("cTo").addEventListener("change",e=>{state.to=e.target.value; clearPreset(); render();});
  document.querySelectorAll(".preset[data-preset]").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.preset,b)));
  document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); document.getElementById("tab-"+b.dataset.tab).classList.add("active");
    state.tab=b.dataset.tab; render();
  }));
}
function clearPreset(){ document.querySelectorAll(".preset[data-preset]").forEach(b=>b.classList.remove("active")); }
function fillAdsets(){
  const m={}; ROWS.forEach(r=>{ if(state.campaign&&r["Campaign"]!==state.campaign) return; const k=(r["Ad Set"]||"").toString(); if(k) m[k]=(m[k]||0)+r._spend; });
  const el=document.getElementById("cAdset"); if(!el) return;
  el.innerHTML=`<option value="">All Ad Sets</option>`+Object.keys(m).sort((x,y)=>m[y]-m[x]).map(a=>`<option${a===state.adset?" selected":""}>${a}</option>`).join("");
}
function shiftDays(d,n){ const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); }
function applyPreset(p,btn){
  clearPreset(); if(btn)btn.classList.add("active");
  if(p==="All"){ state.from=DMIN; state.to=DMAX; }
  else if(p==="This Mo"){ state.to=DMAX; state.from=DMAX.slice(0,7)+"-01"; }
  else if(p==="Last Mo"){ const d=new Date(DMAX.slice(0,7)+"-01T00:00:00"); d.setDate(0); state.to=fmtDate(d); state.from=state.to.slice(0,7)+"-01"; if(state.from<DMIN)state.from=DMIN; }
  else { const n={"7d":6,"14d":13,"30d":29}[p]; state.to=DMAX; state.from=shiftDays(DMAX,n); if(state.from<DMIN)state.from=DMIN; }
  document.getElementById("cFrom").value=state.from; document.getElementById("cTo").value=state.to;
  render();
}

/* ── Render ──────────────────────────────────────────────────────── */
function render(){
  const f=filtered();
  document.getElementById("rowNote").textContent=`${f.length} rows · ${state.from} to ${state.to}`;
  document.getElementById("range").textContent=`${state.from}  to  ${state.to}`;
  if(state.tab==="overview") renderOverview(f);
  else if(state.tab==="trends") renderTrends(f);
  else if(state.tab==="leaderboard") renderLeaderboard(f);
  else if(state.tab==="campaigns") renderCampaigns(f);
  else if(state.tab==="breakdowns") renderBreakdowns(f);
  else if(state.tab==="byad") renderByAd(f);
  else if(state.tab==="headlines") renderHeadlines(f);
  else if(state.tab==="funnel") renderFunnel(f);
  else if(state.tab==="modeled") renderModeled();
  else if(state.tab==="deals") renderDeals();
  else if(state.tab==="sparkloop") renderSparkLoopTab();
  else if(state.tab==="pacing") renderPacing(f);
  else if(state.tab==="creative") renderCreative(f);
}

/* ── Shared: a simple dimension breakdown (table + bar) into a target div ── */
function aggByDim(rows,dimKey){
  const g=groupBy(rows,dimKey);
  let out=Object.entries(g).map(([k,rs])=>({k,...agg(rs)}));
  out=out.filter(x=>x.k!=="(none)"||out.length===1);
  out.sort((a,b)=>IS_ROAS?((a.rev&&b.rev)?b.roas-a.roas:b.spend-a.spend):((a.leads&&b.leads)?a.cpa-b.cpa:b.spend-a.spend));
  return out;
}
function dimTable(out){
  const rh=IS_ROAS?`<th class="num">Revenue</th><th class="num">ROAS</th><th class="num">CPA</th><th class="num">AOV</th>`:`<th class="num">${RESULT_LABEL}</th><th class="num">CPA</th>`;
  const body=out.map(x=>`<tr><td>${x.k}</td><td class="num">${money(x.spend)}</td>`+
    (IS_ROAS?`<td class="num">${money(x.rev)}</td><td class="num">${x.rev?x.roas.toFixed(2)+"x":"—"}</td><td class="num">${x.leads?money(x.cpa):"—"}</td><td class="num">${x.leads?money(x.aov):"—"}</td>`
            :`<td class="num">${num(x.leads)||"—"}</td><td class="num">${x.leads?money(x.cpa):"—"}</td>`)+`</tr>`).join("");
  return `<table><thead><tr><th>Value</th><th class="num">Spend</th>${rh}</tr></thead><tbody>${body}</tbody></table>`;
}
function dimChart(id,out){
  const top=out.slice().sort((a,b)=>b.spend-a.spend).slice(0,12);
  makeChart(id,{type:"bar",data:{labels:top.map(x=>x.k),datasets:[{label:"Spend",data:top.map(x=>x.spend),backgroundColor:top.map((_,i)=>COLORS[i%COLORS.length])}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>"$"+v.toLocaleString()}}}}});
}
function renderCampaigns(f){
  const out=aggByDim(f,"Campaign");
  document.getElementById("tab-campaigns").innerHTML=
    `<div class="card"><h2>By Campaign</h2><div class="chart-wrap" style="height:280px;"><canvas id="campChart"></canvas></div></div>
     <div class="card">${dimTable(out)}</div>`;
  dimChart("campChart",out);
}
function renderFunnel(f){
  const out=aggByDim(f,"Funnel");
  document.getElementById("tab-funnel").innerHTML=
    `<div class="card"><h2>By Funnel stage</h2><div class="chart-wrap" style="height:260px;"><canvas id="funChart"></canvas></div></div>
     <div class="card">${dimTable(out)}</div>`;
  dimChart("funChart",out);
}

/* ── Per-ad aggregation (shared by Leaderboard / By Ad / Creative) ── */
function adsAgg(rows){
  const byAd={};
  rows.forEach(r=>{ const id=r["Ad ID"]; const a=byAd[id]||(byAd[id]={id,name:r["Ad Name"],campaign:r["Campaign"],
    format:r["Format"],audience:r["Audience"],funnel:r["Funnel"],headline:r._headline,body:r._body,
    spend:0,leads:0,rev:0,imp:0,clicks:0,tags:r}); a.spend+=r._spend;a.leads+=r._leads;a.rev+=r._rev;a.imp+=r._imp;a.clicks+=r._clicks; });
  return Object.values(byAd).map(a=>({...a,cpa:a.leads?a.spend/a.leads:0,roas:a.spend&&a.rev?a.rev/a.spend:0,aov:a.leads?a.rev/a.leads:0,
    ctr:a.imp?a.clicks/a.imp*100:0}));
}
function bestFirst(ads){ return ads.slice().sort((a,b)=>IS_ROAS?((a.rev&&b.rev)?b.roas-a.roas:b.spend-a.spend):((a.leads&&b.leads)?a.cpa-b.cpa:(a.leads?-1:b.leads?1:b.spend-a.spend))); }

let lbMinSpend=0;
function renderLeaderboard(f){
  let ads=bestFirst(adsAgg(f).filter(a=>a.spend>=lbMinSpend && (IS_ROAS?a.rev>0:a.leads>0)));
  const rows=ads.slice(0,25).map((a,i)=>`<tr><td class="num">${i+1}</td><td class="adname">${a.name||""}</td>
    <td><span class="pill">${a.format||"—"}</span></td><td>${a.funnel||"—"}</td>
    <td class="num">${money(a.spend)}</td>`+
    (IS_ROAS?`<td class="num">${money(a.rev)}</td><td class="num good">${a.roas.toFixed(2)}x</td><td class="num">${a.leads?money(a.cpa):"—"}</td><td class="num">${a.leads?money(a.aov):"—"}</td>`
            :`<td class="num">${num(a.leads)}</td><td class="num good">${money(a.cpa)}</td>`)+`</tr>`).join("");
  const rh=IS_ROAS?`<th class="num">Revenue</th><th class="num">ROAS</th><th class="num">CPA</th><th class="num">AOV</th>`:`<th class="num">${RESULT_LABEL}</th><th class="num">CPA</th>`;
  document.getElementById("tab-leaderboard").innerHTML=
    `<div class="card"><h2>Top ads by ${IS_ROAS?"ROAS":"cost per "+RESULT_ONE}
       <label style="float:right;font-size:12px;color:var(--muted);">Min spend $<input type="number" id="lbMin" value="${lbMinSpend}" style="width:80px;font:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:6px;"></label></h2>
       <div style="overflow-x:auto"><table><thead><tr><th class="num">#</th><th>Ad</th><th>Format</th><th>Funnel</th><th class="num">Spend</th>${rh}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  const inp=document.getElementById("lbMin");
  inp.addEventListener("change",e=>{lbMinSpend=+e.target.value||0; renderLeaderboard(filtered());});
}

let byAdSort={col:null,asc:true};
function renderByAd(f){
  let ads=adsAgg(f);
  const sval=(a,c)=>{const m={name:(a.name||"").toLowerCase(),campaign:(a.campaign||"").toLowerCase(),format:(a.format||"").toLowerCase(),
    audience:(a.audience||"").toLowerCase(),funnel:(a.funnel||"").toLowerCase(),spend:a.spend,imp:a.imp,clicks:a.clicks,ctr:a.ctr,leads:a.leads,rev:a.rev,cpa:a.cpa,roas:a.roas,aov:a.aov};return m[c];};
  if(byAdSort.col){ const c=byAdSort.col,s=byAdSort.asc?1:-1; ads.sort((a,b)=>{const va=sval(a,c),vb=sval(b,c);return va<vb?-s:va>vb?s:0;}); }
  else ads=bestFirst(ads);
  const arr=c=>byAdSort.col===c?(byAdSort.asc?" ▲":" ▼"):"";
  const sth=(c,l,cls)=>`<th class="${cls||""}" data-sort="${c}">${l}${arr(c)}</th>`;
  const rh=IS_ROAS?sth("rev","Revenue","num")+sth("roas","ROAS","num")+sth("cpa","CPA","num")+sth("aov","AOV","num"):sth("leads",RESULT_LABEL,"num")+sth("cpa","CPA","num");
  const head=`<tr>${sth("name","Ad")}${sth("campaign","Campaign")}${sth("format","Format")}${sth("audience","Audience")}${sth("funnel","Funnel")}${sth("spend","Spend","num")}${sth("imp","Impr","num")}${sth("clicks","Clicks","num")}${sth("ctr","CTR","num")}${rh}</tr>`;
  const rows=ads.map(a=>`<tr><td class="adname">${a.name||""}</td><td>${a.campaign||"—"}</td><td><span class="pill">${a.format||"—"}</span></td>
    <td>${a.audience||"—"}</td><td>${a.funnel||"—"}</td><td class="num">${money(a.spend)}</td><td class="num">${num(a.imp)}</td>
    <td class="num">${num(a.clicks)}</td><td class="num">${a.ctr.toFixed(2)}%</td>`+
    (IS_ROAS?`<td class="num">${money(a.rev)}</td><td class="num">${a.rev?a.roas.toFixed(2)+"x":"—"}</td><td class="num">${a.leads?money(a.cpa):"—"}</td><td class="num">${a.leads?money(a.aov):"—"}</td>`
            :`<td class="num">${num(a.leads)||"—"}</td><td class="num">${a.leads?money(a.cpa):"—"}</td>`)+`</tr>`).join("");
  document.getElementById("tab-byad").innerHTML=
    `<div class="card"><h2>By Ad</h2><div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>`;
  document.querySelectorAll("#tab-byad th[data-sort]").forEach(th=>th.addEventListener("click",()=>{
    const c=th.dataset.sort; if(byAdSort.col===c)byAdSort.asc=!byAdSort.asc; else {byAdSort.col=c; byAdSort.asc=(c==="name"||c==="campaign"||c==="format"||c==="audience"||c==="funnel"||c==="cpa");}
    renderByAd(filtered());
  }));
}

function renderHeadlines(f){
  const hasCopy=ROWS.some(r=>r._headline||r._body);
  if(!hasCopy){ document.getElementById("tab-headlines").innerHTML=
    `<div class="card"><div class="note">No ad copy yet. Re-run the engine to populate Headline / Primary Text in the product sheet.</div></div>`; return; }
  function grp(rows,field){ const g={}; rows.forEach(r=>{ const k=(r[field]||"").toString().trim(); if(!k) return; (g[k]=g[k]||[]).push(r); });
    let out=Object.entries(g).map(([k,rs])=>({k,...agg(rs)}));
    out.sort((a,b)=>IS_ROAS?b.roas-a.roas:(a.leads&&b.leads)?a.cpa-b.cpa:b.spend-a.spend); return out; }
  const heads=grp(f,"_headline"), bodies=grp(f,"_body");
  const rh=IS_ROAS?`<th class="num">Revenue</th><th class="num">ROAS</th><th class="num">CPA</th><th class="num">AOV</th>`:`<th class="num">${RESULT_LABEL}</th><th class="num">CPA</th>`;
  const tbl=(out)=>`<table><thead><tr><th>Text</th><th class="num">Spend</th>${rh}</tr></thead><tbody>`+
    out.map(x=>`<tr><td style="white-space:normal;max-width:520px;">${(x.k||"").slice(0,180)}</td><td class="num">${money(x.spend)}</td>`+
      (IS_ROAS?`<td class="num">${money(x.rev)}</td><td class="num">${x.rev?x.roas.toFixed(2)+"x":"—"}</td><td class="num">${x.leads?money(x.cpa):"—"}</td><td class="num">${x.leads?money(x.aov):"—"}</td>`
              :`<td class="num">${num(x.leads)||"—"}</td><td class="num">${x.leads?money(x.cpa):"—"}</td>`)+`</tr>`).join("")+`</tbody></table>`;
  document.getElementById("tab-headlines").innerHTML=
    `<div class="card"><h2>By Headline</h2><div style="overflow-x:auto">${tbl(heads)}</div></div>`+
    `<div class="card"><h2>By Primary Text</h2><div style="overflow-x:auto">${tbl(bodies)}</div></div>`;
}

/* ── SparkLoop partner earnings: weekly payouts as the API returns them,
   monthly rollup, lifetime total. Whole-history view; ignores the global
   date filter. Expected = payouts SparkLoop is preparing (paid=false). */
function renderSparkLoopTab(){
  const dated=SL.payouts.filter(p=>p.date);
  const paid=SL.payouts.filter(p=>p.status==="Paid");
  const expected=SL.payouts.filter(p=>p.status!=="Paid");
  const lifetime=paid.reduce((s,p)=>s+p.amount,0);
  const expectedTotal=expected.reduce((s,p)=>s+p.amount,0);
  const monthMap={};
  paid.forEach(p=>{ const m=p.date?p.date.slice(0,7):"(no date)";
    (monthMap[m]=monthMap[m]||{amount:0,count:0}); monthMap[m].amount+=p.amount; monthMap[m].count++; });
  const months=Object.keys(monthMap).sort().map(m=>({month:m,...monthMap[m]}));
  const chartMonths=months.filter(m=>m.month!=="(no date)");
  const datedPaid=dated.filter(p=>p.status==="Paid");
  const last=datedPaid.length?datedPaid[datedPaid.length-1]:null;
  const thisMonth=new Date().toISOString().slice(0,7);
  const thisMonthAmt=monthMap[thisMonth]?monthMap[thisMonth].amount:0;
  const activeN=SL.partners.filter(p=>p.status==="active").length;
  const moRows=months.slice().reverse().map(m=>`<tr><td>${m.month}</td><td class="num">${money(m.amount)}</td><td class="num">${m.count}</td></tr>`).join("")+
    `<tr><td><strong>Lifetime</strong></td><td class="num"><strong>${money(lifetime)}</strong></td><td class="num"><strong>${paid.length}</strong></td></tr>`;
  const poRows=dated.slice().reverse().map(p=>`<tr><td>${p.date}</td><td class="num">${money(p.amount)}</td><td>${p.status==="Paid"?"Paid":"<strong>Expected</strong>"}</td></tr>`).join("");
  const paRows=SL.partners.slice().sort((a,b)=>{
      if((a.status==="active")!==(b.status==="active")) return a.status==="active"?-1:1;
      return b.cpa-a.cpa; })
    .map(p=>`<tr><td>${p.name}</td><td>${p.status.replace(/_/g," ")}</td><td class="num">${money(p.cpa)}</td><td class="num">${money(p.maxPayout)}</td></tr>`).join("");
  document.getElementById("tab-sparkloop").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="label">Lifetime Paid</div><div class="val">${money(lifetime)}</div></div>
      <div class="kpi"><div class="label">This Month (${thisMonth})</div><div class="val">${money(thisMonthAmt)}</div></div>
      <div class="kpi"><div class="label">Last Payout${last?" ("+last.date+")":""}</div><div class="val">${last?money(last.amount):"—"}</div></div>
      <div class="kpi"><div class="label">Expected Payout</div><div class="val">${money(expectedTotal)}</div></div>
      <div class="kpi"><div class="label">Active Partner Programs</div><div class="val">${num(activeN)}</div></div>
    </div>
    <div class="card"><h2>Weekly partner payouts</h2><div class="chart-wrap" style="height:280px;"><canvas id="slPayChart"></canvas></div></div>
    <div class="card"><h2>Monthly totals</h2><div class="chart-wrap" style="height:240px;"><canvas id="slMonChart"></canvas></div>
      <div style="overflow-x:auto;max-height:300px;overflow-y:auto;margin-top:10px;">
      <table><thead><tr><th>Month</th><th class="num">Paid</th><th class="num">Payouts</th></tr></thead><tbody>${moRows}</tbody></table></div></div>
    <div class="card"><h2>Payout history (weekly)</h2><div style="overflow-x:auto;max-height:360px;overflow-y:auto;">
      <table><thead><tr><th>Week Ending</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${poRows}</tbody></table></div></div>
    <div class="card"><h2>Ads &times; earnings — net effective cost per ${RESULT_ONE}</h2>
      <div class="chart-wrap" style="height:280px;"><canvas id="slNetChart"></canvas></div>
      <div style="overflow-x:auto;max-height:300px;overflow-y:auto;margin-top:10px;">
      <table><thead><tr><th>Month</th><th class="num">Spend</th><th class="num">${RESULT_LABEL}</th><th class="num">CPA</th>
        <th class="num">SL Earnings</th><th class="num">Net Spend</th><th class="num">Net CPA</th></tr></thead><tbody id="slNetBody"></tbody></table></div>
      <div class="note" style="margin-top:8px;">Net Spend = ad spend minus SparkLoop earnings paid that month. Directional: payouts lag signups (weekly cycles + pending period), and earnings include signups from all sources, not only ads.</div></div>
    <div class="card"><h2>Partner programs (by CPA)</h2><div style="overflow-x:auto;max-height:360px;overflow-y:auto;">
      <table><thead><tr><th>Partner Program</th><th>Status</th><th class="num">CPA</th><th class="num">Max Payout</th></tr></thead><tbody>${paRows}</tbody></table></div></div>`;
  makeChart("slPayChart",{type:"bar",
    data:{labels:dated.map(p=>p.date),
      datasets:[{label:"Payout",data:dated.map(p=>p.amount),

      scales:{x:{ticks:{maxRotation:45,autoSkip:true,maxTicksLimit:18}},
              y:{beginAtZero:true,ticks:{callback:v=>"$"+v.toLocaleString()}}}}});

  // Ads x earnings: monthly ad spend + results vs SL earnings -> net effective CPA
  const adM={};
  ROWS.forEach(r=>{ if(!r._date) return; const m=r._date.slice(0,7);
    (adM[m]=adM[m]||{spend:0,res:0}); adM[m].spend+=r._spend; adM[m].res+=r._leads; });
  const combined=Object.keys(adM).sort().map(m=>{
    const spend=adM[m].spend, res=adM[m].res, earn=monthMap[m]?monthMap[m].amount:0, net=spend-earn;
    return {month:m,spend,res,earn,net,cpa:res>0?spend/res:0,netCpa:res>0?net/res:0}; });
  document.getElementById("slNetBody").innerHTML=combined.slice().reverse().map(c=>

     <td class="num">${c.res>0?money(c.cpa):"—"}</td><td class="num">${money(c.earn)}</td>
     <td class="num">${money(c.net)}</td><td class="num"><strong>${c.res>0?money(c.netCpa):"—"}</strong></td></tr>`).join("");
  makeChart("slNetChart",{type:"bar",
    data:{labels:combined.map(c=>c.month),
      datasets:[
